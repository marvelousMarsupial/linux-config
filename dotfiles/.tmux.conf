# tmux config
# Colors loaded from theme-generated file

# ===========================================
# GENERAL SETTINGS
# ===========================================

# No delay for escape (important for vim)
set -s escape-time 0

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Big scrollback
set -g history-limit 50000

# Enable mouse
set -g mouse on

# Vi mode
setw -g mode-keys vi

# True color + clipboard passthrough.
#
# The chain that has to work:
#   foot (truecolor + OSC52 capable, 24-bit RGB native)
#     → tmux  (must declare both capabilities for the *outer* TERM,
#              or it strips RGB escapes and clipboard escapes from
#              inner pty programs)
#     → inner shell (host shell or `podman exec` into a dev container)
#     → TUI app (nvim, opencode, lazygit, btop)
#
# `default-terminal "tmux-256color"` sets TERM inside tmux. The
# trixie ncurses 6.5 entry for `tmux-256color` advertises the `Tc`
# truecolor capability, which is what apps that go via terminfo
# (rather than $COLORTERM) check. So the inner-side terminfo is
# already truecolor-aware.
#
# `terminal-features` (tmux ≥3.2, the modern declarative
# replacement for the regex-y `terminal-overrides`) tells tmux
# what the *outer* terminal supports so it knows what to pass
# through. We pin two terminals:
#
#   * `xterm-256color` — covers ssh-from-a-different-host with a
#     terminfo that doesn't otherwise advertise RGB.
#   * `foot*`          — the host's own terminal. Glob (`foot`,
#     `foot-extra`) so both terminfo entries match.
#
# And two capabilities:
#
#   * `RGB`       — pass 24-bit truecolor escapes through. Without
#     this, tmux quantises every truecolor escape into the
#     256-color cube before forwarding, catppuccin's gradients
#     render visibly off, and dev-container TUIs look "wrong"
#     because the same truecolor app on the host's bare terminal
#     looks fine.
#   * `clipboard` — pair with `set-clipboard on` below to allow
#     OSC52 clipboard escapes from inner programs (including the
#     `wl-copy` shim shipped inside the dev container) to
#     propagate up to foot, which writes them to the host's
#     Wayland clipboard.
#
# `set-clipboard on` is the actual switch that *enables* OSC52
# forwarding inside tmux — the `terminal-features ...:clipboard`
# above just declares the outer terminal can handle it, this is
# what tells tmux to do it. Default is `external` (only forward
# if the inner program explicitly asked), `on` is "always".
set -g default-terminal "tmux-256color"
set -ga terminal-features ",xterm-256color:RGB"
set -ga terminal-features ",foot*:RGB"
set -ga terminal-features ",foot*:clipboard"
set -g set-clipboard on

# ===========================================
# SMART-SPLITS INTEGRATION
# ===========================================

# Navigation (Alt + hjkl) - works with smart-splits.nvim
bind-key -n M-h if-shell -F "#{@pane-is-vim}" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell -F "#{@pane-is-vim}" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell -F "#{@pane-is-vim}" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell -F "#{@pane-is-vim}" 'send-keys M-l' 'select-pane -R'

# Resize (Alt + Shift + hjkl)
bind-key -n M-H if-shell -F "#{@pane-is-vim}" 'send-keys M-H' 'resize-pane -L 3'
bind-key -n M-J if-shell -F "#{@pane-is-vim}" 'send-keys M-J' 'resize-pane -D 3'
bind-key -n M-K if-shell -F "#{@pane-is-vim}" 'send-keys M-K' 'resize-pane -U 3'
bind-key -n M-L if-shell -F "#{@pane-is-vim}" 'send-keys M-L' 'resize-pane -R 3'

# Pass Alt-t to vim for terminal toggle
bind-key -n M-t if-shell -F "#{@pane-is-vim}" 'send-keys M-t' ''

# ===========================================
# PANE MANAGEMENT (Alt + key)
# ===========================================

# Vertical splits (side-by-side)
bind-key -n M-v split-window -h -c "#{pane_current_path}" "~/.local/bin/nvim"
bind-key -n M-e split-window -h -c "#{pane_current_path}" "yazi"
bind-key -n M-Enter split-window -h -c "#{pane_current_path}"

# Horizontal splits (stacked top/bottom)
bind-key -n M-V split-window -v -c "#{pane_current_path}" "~/.local/bin/nvim"
bind-key -n M-E split-window -v -c "#{pane_current_path}" "yazi"
bind-key -n M-s split-window -v -c "#{pane_current_path}"

# Close pane
bind-key -n M-q kill-pane

# Zoom toggle
bind-key -n M-z resize-pane -Z

# ===========================================
# COPY MODE (Alt + brackets)
# ===========================================

bind-key -n M-[ copy-mode
bind-key -n M-] paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"

# ===========================================
# SESSION MANAGEMENT
# ===========================================

# Detach
bind-key -n M-d detach-client

# New session
bind-key -n M-n new-session

# Switch sessions (next/prev)
bind-key -n M-) switch-client -n
bind-key -n M-( switch-client -p

# Reload config (keep prefix for this)
set -g prefix C-Space
bind r source-file ~/.tmux.conf \; display "Reloaded"

# ===========================================
# NESTED SESSIONS (F12 toggle)
# ===========================================

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=colour8,bg=colour0" \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S

# Remote detection - top status bar
if-shell 'test -n "$SSH_CLIENT"' {
    set -g status-position top
}

# ===========================================
# STATUS BAR (off - minimal setup)
# ===========================================

set -g status off

# ===========================================
# COLORS (loaded from theme)
# ===========================================

source-file -q ~/.config/tmux/colors.conf
