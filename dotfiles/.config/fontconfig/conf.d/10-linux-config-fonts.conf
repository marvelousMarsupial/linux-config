<?xml version="1.0"?>
<!DOCTYPE fontconfig SYSTEM "urn:fontconfig:fonts.dtd">
<!-- One font everywhere, on purpose: GTK, Qt, Chromium and web pages that only
     ask for a generic family all get the font the repo installs. Sites that
     ship their own web fonts are unaffected. Monospace body text is a look, not
     a necessity; drop the sans-serif/serif/system-ui aliases to go back to
     proportional page text. -->
<fontconfig>
  <alias binding="strong">
    <family>monospace</family>
    <prefer><family>CaskaydiaCove Nerd Font Mono</family></prefer>
  </alias>
  <alias binding="strong">
    <family>sans-serif</family>
    <prefer><family>CaskaydiaCove Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>serif</family>
    <prefer><family>CaskaydiaCove Nerd Font</family></prefer>
  </alias>
  <alias binding="strong">
    <family>system-ui</family>
    <prefer><family>CaskaydiaCove Nerd Font</family></prefer>
  </alias>
</fontconfig>
