---
# Catppuccin Mocha — base16 palette tuned for terminal text readability.
#
# This file deliberately diverges from `catppuccin/base16`'s upstream
# Mocha export at base03 and base04. The upstream base16 file fills
# those slots with surface1 (#45475a) and surface2 (#585b70), which
# are part of catppuccin's *structural background* palette tier and
# are intentionally low-contrast against base00 (#1e1e2e). Used for
# what base16 actually uses base03/base04 for in practice — comments,
# line numbers, autosuggest, "subtle text" — those colors render at
# roughly 1.5:1 against the background, well below WCAG's 3:1
# minimum for any text. Symptom we hit in practice: zsh-autosuggest
# text invisible, nvim/opencode comments and line numbers nearly
# unreadable, the whole TUI feeling "muddy".
#
# Catppuccin's own style guide (catppuccin/catppuccin
# docs/style-guide.md) explicitly assigns the *text* tiers to:
#
#   * Subtle text / Line numbers  → Overlay 1  (#7f849c)
#   * Comments                    → Overlay 2  (#9399b2)
#
# So we use those for base04 (subtle text — used for line numbers /
# nvim CursorLineNr) and base03 (comments — used
# by zsh-autosuggest via ANSI bright0 mapping in foot, nvim Comment
# group, etc.). This is a small, deliberate divergence from
# upstream's base16 export in service of the catppuccin team's own
# usage guidance for these slots. All other slots (base00–02,
# base05–0F) match upstream byte-for-byte.
scheme: "Catppuccin Mocha"
author: "https://github.com/catppuccin/catppuccin"
base00: "1e1e2e"  # base
base01: "181825"  # mantle
base02: "313244"  # surface0
base03: "9399b2"  # overlay2 — comments per catppuccin style guide
base04: "7f849c"  # overlay1 — subtle text / line numbers per catppuccin style guide
base05: "cdd6f4"  # text
base06: "f5e0dc"  # rosewater
base07: "b4befe"  # lavender
base08: "f38ba8"  # red
base09: "fab387"  # peach
base0A: "f9e2af"  # yellow
base0B: "a6e3a1"  # green
base0C: "94e2d5"  # teal
base0D: "89b4fa"  # blue
base0E: "cba6f7"  # mauve
base0F: "f2cdcd"  # flamingo
