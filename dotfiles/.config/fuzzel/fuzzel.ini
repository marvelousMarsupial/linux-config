[main]
font=CaskaydiaCove Nerd Font:size=12
icon-theme=hicolor
dpi-aware=no

# Compact centered launcher
width=36
lines=10
horizontal-pad=20
vertical-pad=16
inner-pad=10
line-height=26

# Behavior
terminal=foot
layer=overlay
prompt=""

# Colors loaded from theme
include=~/.config/fuzzel/colors.ini

[border]
width=1
radius=8
