# yazi keymap — overrides on top of the default bindings.
#
# `prepend_keymap` adds bindings to the front of the lookup table so they
# take priority over the defaults shipped with yazi (see the upstream
# `keymap-default.toml` for the base set). We intentionally use prepend
# rather than `keymap` so we don't have to re-list yazi's whole default
# keymap every time it gains a new useful binding.

[mgr]
prepend_keymap = [
    { on = "?", run = "help", desc = "Open help" },
    # ── Removable media ──────────────────────────────────────────────
    #
    # `M` (capital) opens the mount.yazi plugin's interactive picker:
    # a list of every partition (mounted + unmounted) with mount /
    # unmount / eject actions. Capital so it doesn't collide with `m`,
    # which yazi uses by default for the bookmark family (`m<key>`
    # marks, `'<key>` jumps).
    #
    # The plugin file lives at
    # ~/.config/yazi/plugins/mount.yazi/main.lua (vendored from
    # yazi-rs/plugins, see that directory's README).
    { on = "M", run = "plugin mount", desc = "Mount picker (USB / drives)" },

    # Personal mount location; change this path when using another account.
    { on = ["g", "m"], run = "cd /run/media/august", desc = "Go to mounted media" },
]
