# Podman / containers.conf — user-level overrides for rootless podman.
#
# This file is intentionally a no-op. We ship it as a managed
# dotfile (rather than letting it be absent) so that:
#
#   1. The path `~/.config/containers/containers.conf` is forge-
#      owned. If forge ever needs to land a real override here in
#      the future, it can rewrite this file in place; without the
#      managed entry, an ad-hoc edit (e.g. `podman` writing a
#      first-run config) could squat the path.
#   2. The history of *what we tried and why it didn't work* is
#      visible in one place when the next person hits a podman
#      DNS issue.
#
# Why no overrides
# ----------------
# A previous version of this file pinned `[containers] dns_servers`
# to public DNS (1.1.1.1 / 8.8.8.8). That breaks in two ways:
#
#   * On networks that *only* allow outbound DNS to the local
#     gateway (common ISP / hotel / corporate / captive-portal
#     setup), public DNS queries get dropped at the LAN firewall,
#     `podman run` containers can't resolve anything, and
#     `forge dev up` fails on first network access.
#   * It was solving the wrong problem anyway: the `forge dev
#     build` failure that motivated this file is a *Buildah*-
#     specific code path that does NOT read `[containers]
#     dns_servers` (containers/podman issue #15290). The actual
#     build fix lives in `crates/forge/src/commands/dev.rs` —
#     `forge dev build` reads the host's `/etc/resolv.conf` at
#     runtime and passes those nameservers as `--dns=...` flags
#     directly to `podman build`, which is the only thing
#     Buildah honours for build-container DNS.
#
# For `podman run` (which `forge dev up` uses), pasta's default
# behaviour — auto-discover nameservers from the host's
# `/etc/resolv.conf` at container start — works fine on any
# network the host itself works on. Forcing public DNS here
# would only override that with something WORSE on filtered
# networks. So we leave it alone.
#
# Reference: `man 5 containers.conf`. The system file at
# `/usr/share/containers/containers.conf` ships the defaults this
# file overlays per-key; with no keys set here, the system
# defaults stand.
