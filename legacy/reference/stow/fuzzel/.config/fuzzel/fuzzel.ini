[main]
font=monospace:size=14
icon-theme=hicolor
dpi-aware=no

# Appearance - square, centered
width=40
lines=12
horizontal-pad=20
vertical-pad=15
inner-pad=8

# Behavior
terminal=foot
layer=overlay
prompt=❯

# Colors loaded from theme
include=~/.config/fuzzel/colors.ini

[border]
width=2
radius=12
