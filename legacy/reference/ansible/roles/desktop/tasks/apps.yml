---
# Matrix clients (nheko GUI + gomuks terminal)
- name: Install Matrix clients
  ansible.builtin.apt:
    name:
      - nheko
      - gomuks
    state: present

# Obsidian from GitHub releases (x86_64 only - no arm64 builds available)
- name: Install Obsidian
  when: ansible_architecture == 'x86_64'
  block:
    - name: Get latest Obsidian version
      ansible.builtin.uri:
        url: https://api.github.com/repos/obsidianmd/obsidian-releases/releases/latest
        return_content: true
      register: obsidian_release

    - name: Set Obsidian version fact
      ansible.builtin.set_fact:
        obsidian_version: "{{ obsidian_release.json.tag_name | regex_replace('^v', '') }}"

    - name: Set Obsidian download URL
      ansible.builtin.set_fact:
        obsidian_url: >-
          https://github.com/obsidianmd/obsidian-releases/releases/download/v{{
          obsidian_version }}/obsidian_{{ obsidian_version }}_{{ arch_deb }}.deb

    - name: Download Obsidian .deb
      ansible.builtin.get_url:
        url: "{{ obsidian_url }}"
        dest: "/tmp/obsidian_{{ obsidian_version }}_{{ arch_deb }}.deb"
        mode: '0644'

    - name: Install Obsidian
      ansible.builtin.apt:
        deb: "/tmp/obsidian_{{ obsidian_version }}_{{ arch_deb }}.deb"
        state: present

# Zen Browser from official tarball
- name: Get latest Zen version
  ansible.builtin.uri:
    url: https://api.github.com/repos/zen-browser/desktop/releases/latest
    return_content: true
  register: zen_release

- name: Set Zen version and URL facts
  ansible.builtin.set_fact:
    zen_version: "{{ zen_release.json.tag_name }}"
    zen_url: >-
      https://github.com/zen-browser/desktop/releases/download/{{
      zen_release.json.tag_name }}/zen.linux-{{ ansible_architecture }}.tar.xz

- name: Download Zen tarball
  ansible.builtin.get_url:
    url: "{{ zen_url }}"
    dest: "/tmp/zen.tar.xz"
    mode: '0644'

- name: Create Zen directory
  ansible.builtin.file:
    path: /opt/zen
    state: directory
    mode: '0755'

- name: Extract Zen
  ansible.builtin.unarchive:
    src: /tmp/zen.tar.xz
    dest: /opt/zen
    remote_src: true
    extra_opts: [--strip-components=1]

- name: Create Zen symlink
  ansible.builtin.file:
    src: /opt/zen/zen
    dest: /usr/local/bin/zen
    state: link

- name: Create Zen desktop entry
  ansible.builtin.copy:
    dest: /usr/share/applications/zen-browser.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=Zen Browser
      Comment=Experience tranquillity while browsing the web
      Exec=/opt/zen/zen %u
      Icon=/opt/zen/browser/chrome/icons/default/default128.png
      Terminal=false
      Type=Application
      MimeType=text/html;text/xml;application/xhtml+xml;x-scheme-handler/http;x-scheme-handler/https;
      Categories=Network;WebBrowser;
      StartupNotify=true
      StartupWMClass=zen
