---
- name: Install remote desktop packages
  ansible.builtin.apt:
    name:
      - dbus-x11  # Required for D-Bus session (dark mode, gsettings)
    state: present

- name: Allow VNC through firewall (WireGuard subnet only)
  community.general.ufw:
    rule: allow
    from_ip: 10.0.0.0/24
    port: '5900'
    proto: tcp
    comment: VNC over WireGuard
