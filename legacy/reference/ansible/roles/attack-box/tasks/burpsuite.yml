---
# Burp Suite Community Edition (JAR download)
# Not in Debian repos - downloaded from PortSwigger

- name: Create Burp Suite directory
  ansible.builtin.file:
    path: /opt/burpsuite
    state: directory
    mode: '0755'

- name: Download Burp Suite Community
  ansible.builtin.get_url:
    url: https://portswigger-cdn.net/burp/releases/download?product=community&type=Jar
    dest: /opt/burpsuite/burpsuite.jar
    mode: '0644'
  register: burp_download
  until: burp_download is succeeded
  retries: 3
  delay: 5

- name: Create Burp Suite wrapper script
  ansible.builtin.copy:
    dest: /usr/local/bin/burpsuite
    mode: '0755'
    content: |
      #!/bin/bash
      # Burp Suite Community Edition
      # Increase memory for larger scans: burpsuite -Xmx4g
      exec java -jar /opt/burpsuite/burpsuite.jar "$@"

- name: Create Burp Suite desktop entry
  ansible.builtin.copy:
    dest: /usr/share/applications/burpsuite.desktop
    mode: '0644'
    content: |
      [Desktop Entry]
      Name=Burp Suite
      Comment=Web security testing
      Exec=java -jar /opt/burpsuite/burpsuite.jar
      Icon=burpsuite
      Terminal=false
      Type=Application
      Categories=Network;Security;
      StartupNotify=true
