---
# User setup - creates user and configures environment

- name: Set hostname
  ansible.builtin.hostname:
    name: "{{ effective_hostname }}"
  when: effective_hostname is defined and effective_hostname | length > 0

- name: Create user
  ansible.builtin.user:
    name: "{{ effective_user.name }}"
    shell: "{{ effective_user.shell | default('/bin/zsh') }}"
    groups: "{{ effective_user.groups | default(['sudo']) }}"
    append: true
    create_home: true
  when: effective_user is defined and effective_user.name != 'root'

- name: Allow sudo without password
  ansible.builtin.copy:
    dest: "/etc/sudoers.d/{{ effective_user.name }}"
    content: "{{ effective_user.name }} ALL=(ALL) NOPASSWD:ALL"
    mode: "0440"
  when: effective_user is defined and effective_user.name != 'root'

- name: Check if repo exists in root home
  ansible.builtin.stat:
    path: /root/linux-config
  register: root_repo

- name: Check if repo exists in user home
  ansible.builtin.stat:
    path: "/home/{{ effective_user.name }}/linux-config"
  register: user_repo
  when: effective_user is defined and effective_user.name != 'root'

- name: Clone repo to user home if not present
  ansible.builtin.git:
    repo: "{{ gitea_url | default('http://git.rat/August/linux-config.git') }}"
    dest: "/home/{{ effective_user.name }}/linux-config"
    version: main
  become_user: "{{ effective_user.name }}"
  when:
    - effective_user is defined
    - effective_user.name != 'root'
    - not user_repo.stat.exists
    - not root_repo.stat.exists
  ignore_errors: true

- name: Copy repo from root to user home (if cloned as root)
  ansible.builtin.copy:
    src: /root/linux-config/
    dest: "/home/{{ effective_user.name }}/linux-config"
    remote_src: true
    owner: "{{ effective_user.name }}"
    group: "{{ effective_user.name }}"
  when:
    - effective_user is defined
    - effective_user.name != 'root'
    - root_repo.stat.exists
    - not user_repo.stat.exists

- name: Create .local/bin directory
  ansible.builtin.file:
    path: "/home/{{ effective_user.name }}/.local/bin"
    state: directory
    owner: "{{ effective_user.name }}"
    group: "{{ effective_user.name }}"
    mode: "0755"
  when: effective_user is defined and effective_user.name != 'root'

- name: Create .config directory
  ansible.builtin.file:
    path: "/home/{{ effective_user.name }}/.config"
    state: directory
    owner: "{{ effective_user.name }}"
    group: "{{ effective_user.name }}"
    mode: "0755"
  when: effective_user is defined and effective_user.name != 'root'
