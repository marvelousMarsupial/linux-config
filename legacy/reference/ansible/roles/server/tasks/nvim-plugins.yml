---
# Clear nvim data for fresh plugin install
- name: Remove existing nvim data
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.local/share/nvim"
    - "{{ target_home }}/.local/state/nvim"
    - "{{ target_home }}/.cache/nvim"

# nvim config is deployed via stow in dotfiles.yml

- name: Install nvim plugins
  ansible.builtin.shell: |
    {{ target_home }}/.local/bin/nvim --headless "+Lazy! sync" +qa
  become: true
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"
  register: nvim_plugins
  changed_when: nvim_plugins.rc == 0

- name: Install Mason LSP servers
  ansible.builtin.shell: |
    {{ target_home }}/.local/bin/nvim --headless "+MasonInstall {{ mason_lsp_servers | join(' ') }}" +qa || true
  become: true
  become_user: "{{ target_user }}"
  environment:
    HOME: "{{ target_home }}"
  ignore_errors: true
