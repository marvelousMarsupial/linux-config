---
- name: Install unattended-upgrades
  ansible.builtin.apt:
    name:
      - unattended-upgrades
      - apt-listchanges
    state: present

- name: Configure unattended-upgrades for full upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/50unattended-upgrades
    mode: '0644'
    content: |
      Unattended-Upgrade::Allowed-Origins {
          "${distro_id}:${distro_codename}";
          "${distro_id}:${distro_codename}-security";
          "${distro_id}:${distro_codename}-updates";
      };
      Unattended-Upgrade::Remove-Unused-Dependencies "true";
      Unattended-Upgrade::Automatic-Reboot "false";

- name: Enable weekly auto-upgrades
  ansible.builtin.copy:
    dest: /etc/apt/apt.conf.d/20auto-upgrades
    mode: '0644'
    content: |
      APT::Periodic::Update-Package-Lists "7";
      APT::Periodic::Unattended-Upgrade "7";
      APT::Periodic::Download-Upgradeable-Packages "7";
      APT::Periodic::AutocleanInterval "7";

- name: Create nvim plugin update script
  ansible.builtin.copy:
    dest: "{{ target_home }}/.local/bin/nvim-update-plugins"
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    content: |
      #!/bin/bash
      {{ target_home }}/.local/bin/nvim --headless "+Lazy! sync" +qa

- name: Create systemd user directory
  ansible.builtin.file:
    path: "{{ target_home }}/.config/systemd/user"
    state: directory
    mode: '0755'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Create nvim-update service
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/systemd/user/nvim-update.service"
    mode: '0644'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    content: |
      [Unit]
      Description=Update Neovim plugins

      [Service]
      Type=oneshot
      ExecStart={{ target_home }}/.local/bin/nvim-update-plugins

- name: Create nvim-update timer (weekly)
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/systemd/user/nvim-update.timer"
    mode: '0644'
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    content: |
      [Unit]
      Description=Weekly Neovim plugin update

      [Timer]
      OnCalendar=weekly
      Persistent=true

      [Install]
      WantedBy=timers.target

- name: Enable linger for user (allows user services without login)
  ansible.builtin.command:
    cmd: loginctl enable-linger {{ target_user }}
  changed_when: true
  ignore_errors: true

- name: Enable nvim-update timer
  ansible.builtin.command:
    cmd: >-
      su - {{ target_user }} -c
      "XDG_RUNTIME_DIR=/run/user/$(id -u {{ target_user }})
       systemctl --user daemon-reload &&
       systemctl --user enable nvim-update.timer"
  changed_when: true
  ignore_errors: true  # May fail if no session, timer files are in place for next login
