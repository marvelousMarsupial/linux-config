---
- name: Allow ports through firewall
  community.general.ufw:
    rule: allow
    port: "{{ item }}"
    proto: tcp
  loop: "{{ firewall.allowed_ports }}"

- name: Enable ufw
  community.general.ufw:
    state: enabled
    policy: "{{ firewall.default_policy }}"

- name: Configure fail2ban for SSH
  ansible.builtin.copy:
    dest: /etc/fail2ban/jail.local
    content: |
      [sshd]
      enabled = true
      port = {{ ports.ssh }}
      filter = sshd
      maxretry = {{ firewall.fail2ban.max_retries }}
      bantime = {{ firewall.fail2ban.ban_time }}
      findtime = {{ firewall.fail2ban.find_time }}

- name: Enable fail2ban
  ansible.builtin.systemd:
    name: fail2ban
    enabled: true
    state: started
