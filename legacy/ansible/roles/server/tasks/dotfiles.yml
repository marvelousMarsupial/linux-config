---
# Dotfiles setup - uses target_user/target_home from playbook vars

- name: Create trash directory
  ansible.builtin.file:
    path: "{{ target_home }}/.trash"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: true

- name: Remove existing dotfiles (so stow can create symlinks)
  ansible.builtin.file:
    path: "{{ target_home }}/{{ item }}"
    state: absent
  loop: "{{ stow_cleanup.server }}"
  become: true

- name: Create config directory
  ansible.builtin.file:
    path: "{{ target_home }}/.config"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
  become: true

- name: Stow dotfiles
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    stow -t {{ target_home }} {{ stow_packages.server | join(' ') }}
  become: true
  become_user: "{{ target_user }}"
