---
# =============================================================================
# Dev Role - Development Tools & Services
# =============================================================================
# Creates these scripts in ~/.local/bin/:
#   - coder-start     Start code-server (alias: coder)
#   - coder-stop      Stop code-server
#   - jupyter-start   Start JupyterLab (alias: jupyter)
#   - jupyter-stop    Stop JupyterLab
#   - cloudbeaver-start  Start CloudBeaver (alias: cloudbeaver, dbeaver)
#   - cloudbeaver-stop   Stop CloudBeaver
# =============================================================================

- name: Include server role
  ansible.builtin.include_role:
    name: server

- name: Import dev-server tasks
  ansible.builtin.import_tasks: packages.yml

- name: Import npm tasks
  ansible.builtin.import_tasks: npm.yml

- name: Import binaries tasks
  ansible.builtin.import_tasks: binaries.yml

- name: Import services tasks
  ansible.builtin.import_tasks: services.yml

- name: Import cloudbeaver tasks
  ansible.builtin.import_tasks: cloudbeaver.yml
