---
- name: Deploy workstation
  hosts: localhost
  connection: local
  become: true
  vars:
    deploy_role: "{{ role | default('server') }}"
    # Instance overrides (for VMs/containers) - if not set, use inventory values
    # instance_user: "{{ instance_user | default(omit) }}"
    # instance_hostname: "{{ instance_hostname | default(omit) }}"
    # Effective user config - instance override takes precedence
    effective_user:
      name: "{{ instance_user | default(user.name) | default('root') }}"
      shell: "{{ user.shell | default('/bin/zsh') }}"
      groups: "{{ user.groups | default(['sudo']) }}"
    effective_hostname: "{{ instance_hostname | default(hostname) | default(omit) }}"
    # Target user for dotfiles
    target_user: "{{ effective_user.name }}"
    target_home: "{{ '/home/' + effective_user.name if effective_user.name != 'root' else '/root' }}"
  roles:
    - "{{ deploy_role }}"
