# tmux config
# Colors loaded from theme-generated file

# ===========================================
# GENERAL SETTINGS
# ===========================================

# No delay for escape (important for vim)
set -s escape-time 0

# Start windows/panes at 1
set -g base-index 1
setw -g pane-base-index 1

# Renumber windows when one is closed
set -g renumber-windows on

# Big scrollback
set -g history-limit 50000

# Enable mouse
set -g mouse on

# Vi mode
setw -g mode-keys vi

# True color support
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"

# ===========================================
# SMART-SPLITS INTEGRATION
# ===========================================

# Navigation (Alt + hjkl) - works with smart-splits.nvim
bind-key -n M-h if-shell -F "#{@pane-is-vim}" 'send-keys M-h' 'select-pane -L'
bind-key -n M-j if-shell -F "#{@pane-is-vim}" 'send-keys M-j' 'select-pane -D'
bind-key -n M-k if-shell -F "#{@pane-is-vim}" 'send-keys M-k' 'select-pane -U'
bind-key -n M-l if-shell -F "#{@pane-is-vim}" 'send-keys M-l' 'select-pane -R'

# Resize (Alt + Shift + hjkl)
bind-key -n M-H if-shell -F "#{@pane-is-vim}" 'send-keys M-H' 'resize-pane -L 3'
bind-key -n M-J if-shell -F "#{@pane-is-vim}" 'send-keys M-J' 'resize-pane -D 3'
bind-key -n M-K if-shell -F "#{@pane-is-vim}" 'send-keys M-K' 'resize-pane -U 3'
bind-key -n M-L if-shell -F "#{@pane-is-vim}" 'send-keys M-L' 'resize-pane -R 3'

# Pass Alt-t to vim for terminal toggle
bind-key -n M-t if-shell -F "#{@pane-is-vim}" 'send-keys M-t' ''

# ===========================================
# PANE MANAGEMENT (Alt + key)
# ===========================================

# Vertical splits (side-by-side)
bind-key -n M-v split-window -h -c "#{pane_current_path}" "~/.local/bin/nvim"
bind-key -n M-e split-window -h -c "#{pane_current_path}" "yazi"
bind-key -n M-Enter split-window -h -c "#{pane_current_path}"

# Horizontal splits (stacked top/bottom)
bind-key -n M-V split-window -v -c "#{pane_current_path}" "~/.local/bin/nvim"
bind-key -n M-E split-window -v -c "#{pane_current_path}" "yazi"
bind-key -n M-s split-window -v -c "#{pane_current_path}"

# Close pane
bind-key -n M-q kill-pane

# Zoom toggle
bind-key -n M-z resize-pane -Z

# ===========================================
# COPY MODE (Alt + brackets)
# ===========================================

bind-key -n M-[ copy-mode
bind-key -n M-] paste-buffer

bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi y send-keys -X copy-pipe-and-cancel "wl-copy 2>/dev/null || xclip -selection clipboard"

# ===========================================
# SESSION MANAGEMENT
# ===========================================

# Detach
bind-key -n M-d detach-client

# New session
bind-key -n M-n new-session

# Switch sessions (next/prev)
bind-key -n M-) switch-client -n
bind-key -n M-( switch-client -p

# Reload config (keep prefix for this)
set -g prefix C-Space
bind r source-file ~/.tmux.conf \; display "Reloaded"

# ===========================================
# NESTED SESSIONS (F12 toggle)
# ===========================================

bind -T root F12 \
    set prefix None \;\
    set key-table off \;\
    set status-style "fg=colour8,bg=colour0" \;\
    refresh-client -S

bind -T off F12 \
    set -u prefix \;\
    set -u key-table \;\
    set -u status-style \;\
    refresh-client -S

# Remote detection - top status bar
if-shell 'test -n "$SSH_CLIENT"' {
    set -g status-position top
}

# ===========================================
# STATUS BAR (off - minimal setup)
# ===========================================

set -g status off

# ===========================================
# COLORS (loaded from theme)
# ===========================================

source-file -q ~/.config/tmux/colors.conf
