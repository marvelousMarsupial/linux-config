[workspace]
resolver = "2"
members = ["crates/common", "crates/forge"]

[workspace.package]
version = "0.1.0"
edition = "2021"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
toml = "0.8"
serde_json = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
cliclack = "0.3"
owo-colors = "4"
tera = "1"
include_dir = "0.7"
dirs = "5"
duct = "0.13"
tempfile = "3"
similar = "2"
globset = "0.4"

[profile.release]
lto = "thin"
codegen-units = 1
strip = true
