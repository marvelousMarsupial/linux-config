# Upstream releases installed by scripts/setup, pinned by tag and SHA-256.
# Review release notes, then update with scripts/releases (check, bump).
# An asset name may contain {version}, the tag without its leading v.
# An optional url replaces the GitHub download location for an entry: assets
# are then fetched from <url>/<asset>; check and bump still read GitHub.

[yazi]
repository = "sxyazi/yazi"
tag = "v26.9.1"

[yazi.assets]
"yazi-x86_64-unknown-linux-musl.zip" = "9b9c39decccf8cb0ff53a7d637d38f8a79d93bbd0099f4ea9c619ef6bb392f5d"
"yazi-aarch64-unknown-linux-musl.zip" = "dd569daecaae914185f295634109295ccd25c1b42b02eb89a74f651970024f2e"

