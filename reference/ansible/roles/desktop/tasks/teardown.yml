---
# Teardown desktop role (removes ONLY desktop-specific additions)

- name: Remove desktop stow symlinks
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    stow -D -t {{ target_home }} sway foot fuzzel mako 2>/dev/null || true
  become: false
  ignore_errors: true

- name: Remove desktop theme files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.config/foot/colors.ini"
    - "{{ target_home }}/.config/sway/colors"
    - "{{ target_home }}/.config/fuzzel/colors.ini"
  become: false

- name: Note about Flatpaks
  ansible.builtin.debug:
    msg: "Flatpak apps not removed. Run 'flatpak uninstall' manually."
