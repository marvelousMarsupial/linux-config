---
- name: Install Incus dependencies
  ansible.builtin.apt:
    name:
      - gpg
      - curl
    state: present

- name: Create keyrings directory
  ansible.builtin.file:
    path: /etc/apt/keyrings
    state: directory
    mode: "0755"

- name: Download Zabbly GPG key
  ansible.builtin.get_url:
    url: https://pkgs.zabbly.com/key.asc
    dest: /etc/apt/keyrings/zabbly.asc
    mode: "0644"

- name: Add Zabbly Incus stable repository
  vars:
    incus_repo: >-
      deb [signed-by=/etc/apt/keyrings/zabbly.asc]
      https://pkgs.zabbly.com/incus/stable {{ ansible_distribution_release }} main
  ansible.builtin.apt_repository:
    repo: "{{ incus_repo }}"
    filename: zabbly-incus-stable
    state: present

- name: Install Incus
  ansible.builtin.apt:
    name: incus
    state: present
    update_cache: true

- name: Add user to incus-admin group
  ansible.builtin.user:
    name: "{{ target_user }}"
    groups: incus-admin
    append: true
