---
- name: Install theme dependencies
  ansible.builtin.apt:
    name:
      - python3-yaml
      - python3-jinja2
    state: present

- name: Remove stow conflicts for theme
  ansible.builtin.shell: |
    [ -e "{{ item }}" ] && [ ! -L "{{ item }}" ] && rm -rf "{{ item }}" || true
  loop:
    - "{{ target_home }}/.config/theme"
  changed_when: false

- name: Stow theme configuration
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    stow -t {{ target_home }} theme
  args:
    creates: "{{ target_home }}/.config/theme/config.toml"
  become_user: "{{ target_user }}"

- name: Create theme cache directory
  ansible.builtin.file:
    path: "{{ target_home }}/.cache/theme"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"

- name: Apply default theme
  ansible.builtin.command:
    cmd: "{{ target_home }}/linux-config/bin/theme apply {{ default_theme }}"
  become_user: "{{ target_user }}"
  changed_when: true
