---
- name: Install base packages
  ansible.builtin.apt:
    name: "{{ packages_base + packages_server }}"
    state: present
    update_cache: true

- name: Create podman config directory
  ansible.builtin.file:
    path: "{{ target_home }}/.config/containers"
    state: directory
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0755"
  become: true

- name: Configure podman to use cgroupfs (for VM/container compatibility)
  ansible.builtin.copy:
    dest: "{{ target_home }}/.config/containers/containers.conf"
    content: |
      [engine]
      cgroup_manager = "cgroupfs"
    owner: "{{ target_user }}"
    group: "{{ target_user }}"
    mode: "0644"
  become: true
