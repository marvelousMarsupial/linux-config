---
# Teardown server role - return to basic state

- name: Unstow all packages
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    for pkg in */; do
      stow -D -t ~ "$pkg" 2>/dev/null || true
    done
  args:
    executable: /bin/bash
  become: false
  ignore_errors: true

- name: Remove generated theme configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.config/nvim/lua/plugins/colorscheme.lua"
    - "{{ target_home }}/.config/yazi/theme.toml"
    - "{{ target_home }}/.config/foot/colors.ini"
    - "{{ target_home }}/.config/fuzzel/colors.ini"
    - "{{ target_home }}/.config/sway/colors"
    - "{{ target_home }}/.config/tmux/colors.conf"
    - "{{ target_home }}/.config/gtk-3.0/gtk.css"
    - "{{ target_home }}/.config/gtk-4.0/gtk.css"

- name: Remove config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.config/yazi"
    - "{{ target_home }}/.config/nvim"
    - "{{ target_home }}/.config/theme"
    - "{{ target_home }}/.config/tmux"
    - "{{ target_home }}/.cache/theme"
    - "{{ target_home }}/.cache/forge"
    - "{{ target_home }}/.local/share/nvim"

- name: Remove dotfiles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.tmux.conf"
    - "{{ target_home }}/.zshrc"
    - "{{ target_home }}/.zsh_aliases"
    - "{{ target_home }}/.bashrc"
    - "{{ target_home }}/.config/starship.toml"

- name: Reset shell to bash
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /bin/bash
  become: true

# Full teardown - remove installed packages
- name: Disable firewall (full teardown)
  community.general.ufw:
    state: disabled
  become: true
  ignore_errors: true
  when: full_teardown | default(false) | bool

- name: Remove installed packages (full teardown)
  ansible.builtin.apt:
    name:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - tmux
      - stow
      - btop
      - bat
      - eza
      - fd-find
      - ripgrep
      - trash-cli
      - wireguard-tools
      - podman
      - ufw
      - fail2ban
      # NOTE: python3-yaml and python3-jinja2 kept - ansible needs them
    state: absent
    autoremove: true
  become: true
  ignore_errors: true
  when: full_teardown | default(false) | bool

- name: Remove neovim (full teardown)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.local/bin/nvim"
    - "{{ target_home }}/.local/nvim-runtime"
  when: full_teardown | default(false) | bool

- name: Remove yazi (full teardown)
  ansible.builtin.file:
    path: "{{ target_home }}/.local/bin/yazi"
    state: absent
  when: full_teardown | default(false) | bool

- name: Remove starship (full teardown)
  ansible.builtin.file:
    path: "{{ target_home }}/.local/bin/starship"
    state: absent
  when: full_teardown | default(false) | bool

- name: Remove incus (full teardown)
  ansible.builtin.apt:
    name: incus
    state: absent
    autoremove: true
  become: true
  ignore_errors: true
  when: full_teardown | default(false) | bool

- name: Remove Zabbly repo (full teardown)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - /etc/apt/sources.list.d/zabbly-incus-stable.list
    - /etc/apt/keyrings/zabbly.asc
  become: true
  when: full_teardown | default(false) | bool
