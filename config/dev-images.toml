# Dev container image definitions.
#
# Volumes:
#   named = [{ name, container }] — persistent podman volume (code, home dir)
#   bind  = [{ host, container }] — host path mounted into container
#
# Named volumes use `{name}` as a placeholder for the container name.
# SSH keys are NEVER mounted. The host's ssh-agent socket is forwarded
# at create time so the container can sign requests without seeing keys.
# Git user config lives in the volume (set once, persists).

[[image]]
name = "base"
containerfile = "containers/base.Containerfile"
default_ports = []
ssh_agent = true

[image.default_volumes]
named = [
    { name = "{name}-home", container = "/home/dev" },
]
bind = []

[[image]]
name = "rust"
containerfile = "containers/rust.Containerfile"
default_ports = [3000]
ssh_agent = true

[image.default_volumes]
named = [
    { name = "{name}-home", container = "/home/dev" },
]
bind = []
