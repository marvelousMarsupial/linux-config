# Role definitions. Each role can `extends` another; the base role's
# steps run before the child's (packages appended, dotfiles merged).
#
# `dotfiles` is a list of glob patterns against the embedded dotfiles tree
# (which mirrors $HOME). Matching files are written to $HOME/<path>, with
# any existing files compared so idempotent reruns skip unchanged content.
#
# `downloads` fetch binaries that aren't in apt. Skipped if dest already
# exists unless `--refresh-downloads` is passed.

[server]
packages = [
    "zsh",
    "zsh-autosuggestions",
    "zsh-syntax-highlighting",
    "tmux",
    "fzf",
    "ripgrep",
    "fd-find",
    "jq",
    "git",
    "curl",
    "ca-certificates",
    "eza",
    "bat",
    "unzip",
    # `trash-cli` provides the `trash`/`trash-put`/`trash-list`/
    # `trash-restore`/`trash-empty` commands that move files to the
    # XDG trash spec location (`~/.local/share/Trash`) instead of
    # `rm`'s unrecoverable unlink. Aliased so a fat-fingered `rm`
    # on a real file is recoverable.
    "trash-cli",
    # Extended terminfo entries — ncurses-term provides terminfo for
    # foot, foot-extra, tmux-256color, alacritty, kitty, and the rest
    # of the modern terminal lineup. The Debian default `ncurses-base`
    # package ships only the classics (xterm, vt100, linux). Without
    # this, SSHing from a foot terminal to this server lands the
    # remote shell in a TERM with no terminfo entry, ncurses
    # applications (vim, yazi, less, htop) fall back to minimal /
    # wrong escape sequences, and the rendering looks broken even
    # though the host terminal is fine. On Debian trixie this package
    # also `Provides: foot-terminfo` (the foot-terminfo apt package
    # itself is now an empty transitional shim).
    "ncurses-term",
    # whisper.cpp runtime libraries — we ship a vendored prebuilt
    # whisper-server (see `dotfiles/.local/bin/whisper-server`) instead
    # of building from source on each host, but the binary still
    # dynamically links against:
    #   * `libopenblas0` — BLAS implementation that ggml-blas calls.
    #     Also Provides libblas.so.3 via update-alternatives.
    #   * `libgomp1` — GNU OpenMP runtime ggml-cpu uses for thread
    #     pooling. Sometimes already pulled in by libgcc, but we list
    #     it explicitly so a minimal trixie install gets it.
    # libgfortran5 is a runtime dep of libopenblas0 and gets pulled in
    # transitively, so we don't list it. Lives in `server` rather than
    # `desktop` because the user wanted these "future-fresh-install"
    # essentials in the broadest base; whisper-server is a host-side
    # tool and the binary lands wherever the dotfiles are written.
    "libopenblas0",
    "libgomp1",
    # Container runtime — `forge dev` shells out to podman, and per the
    # project's dev model every host (server, desktop) is expected to
    # be able to spin up dev pods. Putting these in the base `server`
    # role is the way that works without branching the role list.
    # Rootless podman needs four companions on Debian trixie:
    #   * `uidmap`         — newuidmap/newgidmap setuid helpers; without
    #                        them rootless containers fail at create time.
    #   * `passt`          — provides `pasta`, the userspace network
    #                        stack podman 5+ uses by default for rootless
    #                        containers' outbound traffic. Without it,
    #                        every `podman build` / `podman run` errors
    #                        out at namespace setup with `could not find
    #                        pasta, the network namespace can't be
    #                        configured`. Trixie's podman is 5.x.
    #   * `slirp4netns`    — older userspace network stack, kept around
    #                        as a fallback for the few podman commands
    #                        that still ask for it (and so that pinning
    #                        `--network=slirp4netns` still works for
    #                        ad-hoc debugging).
    #   * `fuse-overlayfs` — overlay storage driver that works without
    #                        root. Without it podman falls back to vfs,
    #                        which copies the whole image on every layer
    #                        (slow + huge disk usage).
    #   * `nftables`       — provides the `nft` CLI that podman's
    #                        network backend (netavark) shells out to
    #                        for firewall / NAT rule programming on
    #                        every container with networking. Without
    #                        it `podman build` and `podman run` fail at
    #                        network-setup time with "netavark:
    #                        nftables error: unable to execute nft: No
    #                        such file or directory" — which is
    #                        especially confusing because podman itself
    #                        is installed and the failure surfaces deep
    #                        inside the build (after image pull and the
    #                        first RUN step starts). Trixie's netavark
    #                        defaults to nftables (the iptables-legacy
    #                        path is being phased out), so this is
    #                        mandatory regardless of rootless/rootful.
    "podman",
    "uidmap",
    "passt",
    "slirp4netns",
    "fuse-overlayfs",
    "nftables",
    # Virt stack — system containers (incus) + full VMs (libvirt/qemu).
    # Lives in the `server` base role so both roles ship with it
    # (desktop extends server). The `vm-menu` script bound to $mod+c
    # in sway is the user-facing entry point; it shells out to
    # `podman` / `incus` / `virsh` to enumerate instances and
    # dispatch start/stop/shell actions across all three runtimes.
    # Putting the heavy daemons in `server` keeps headless boxes
    # capable of running them too — the desktop role piles
    # `virt-manager` (the GTK GUI) on top for graphical console
    # access, but the underlying CLIs work fine without an X/wayland
    # session.
    #
    #   * `incus`               — system-container manager (LXD
    #     fork). The `incus admin init --auto` post-command below
    #     stands up the default `incusbr0` bridge, a `dir`-backed
    #     storage pool under /var/lib/incus, and a `default` profile
    #     — enough that `incus launch images:debian/13` works
    #     end-to-end on a fresh box.
    #   * `incus-client`        — the `incus` CLI binary, separate
    #     package so headless / remote-only hosts can install just
    #     the client. We always want both on every host.
    #   * `qemu-system-x86`     — x86_64 system emulator/
    #     virtualizer. The actual hypervisor process libvirt spawns
    #     per VM.
    #   * `qemu-kvm`            — Debian compatibility shim that
    #     pulls in the kernel-side KVM accel glue. Without it
    #     libvirt happily defines VMs but they fall back to pure
    #     software emulation (10-100x slower, fans pegged on a
    #     mostly-idle guest); on trixie this is a separate package
    #     from `qemu-system-x86`, so we need both listed.
    #   * `libvirt-daemon-system` — `libvirtd` plus the package's
    #     postinst that defines the default `virbr0` NAT network
    #     and the /var/lib/libvirt/images storage pool. The
    #     post-commands below mark the network autostart so VMs
    #     come back up after a host reboot without manual
    #     `virsh net-start`.
    #   * `libvirt-clients`     — provides `virsh`, the primary
    #     CLI the vm-menu script shells out to. Also hosts the
    #     `virt-host-validate` diagnostic which is invaluable
    #     when KVM isn't accelerating (kernel module missing,
    #     nested-virt off in BIOS, etc).
    #   * `bridge-utils`        — ships `brctl` for inspecting the
    #     libvirt-managed `virbr0`. Tiny package, nice to have for
    #     ad-hoc bridge debugging when networking misbehaves.
    #   * `virtinst`            — provides `virt-install`, the
    #     supported way to provision a new VM from an ISO without
    #     going through the virt-manager GUI. Lets headless server
    #     hosts spin up VMs from the shell.
    #   * `qemu-system-modules-spice` — provides the SPICE
    #     display backend module qemu loads at `-spice …` time.
    #     Incus *always* invokes qemu with
    #     `-spice unix=on,disable-ticketing=on,addr=…/qemu.spice`
    #     so it can offer a graphical console socket for
    #     `incus console --type=vga` (and so virt-viewer can
    #     attach later if the user wants a GUI). Without this
    #     module qemu errors at boot with "There is no option
    #     group 'spice'" and the VM never starts — even though
    #     the user never explicitly asked for a graphical console.
    #     Debian splits the SPICE backend out of qemu-system-x86
    #     to keep the base install lean for headless-only
    #     workloads, but every incus VM trips this requirement.
    #   * `qemu-utils`          — ships `qemu-img`, `qemu-nbd`,
    #     `qemu-storage-daemon`. Incus shells out to `qemu-img` to
    #     materialize a per-VM root disk from the cached image
    #     (qcow2 inspect / convert / overlay), and without it
    #     `incus init --vm` fails with "Failed reading image
    #     info … Failed to find executable 'qemu-img'" *despite*
    #     `qemu-system-x86` being installed — the two packages
    #     are split on Debian and `qemu-system-x86` does NOT
    #     pull `qemu-utils` as a dep. libvirt also needs
    #     `qemu-img` for `virt-install --disk path=…,size=…`
    #     to allocate a new qcow2 backing file. Treated as
    #     virt-stack-critical, not optional.
    #   * `ovmf`                — UEFI firmware blobs (OVMF_CODE.fd,
    #     OVMF_VARS.fd) under /usr/share/OVMF/. Required by both
    #     virt drivers we use:
    #       - **incus**: `incus init --vm` defaults to UEFI boot.
    #         Without ovmf the daemon's startup feature-check fails
    #         with "Unable to locate a UEFI firmware" and the
    #         `virtual-machine` instance type is marked
    #         non-operational — every `incus init … --vm` then
    #         errors with "Instance type 'virtual-machine' is not
    #         supported on this server: QEMU failed to run feature
    #         checks", *even though* qemu/kvm are installed.
    #         Restart `incus.service` after install for the daemon
    #         to re-probe.
    #       - **libvirt/virt-install**: any guest template that
    #         wants Secure Boot, > 2 TiB disks, or modern Windows
    #         needs OVMF. virt-manager's "create new VM" wizard
    #         silently downgrades to legacy SeaBIOS otherwise,
    #         which surprises users on first boot of a UEFI-only
    #         install ISO.
    #     Pinned by `server_role_provisions_virt_stack` so a
    #     refactor that drops it gets caught at `cargo test`,
    #     not at `incus init --vm` on a fresh box.
    "incus",
    "incus-client",
    "qemu-system-x86",
    "qemu-system-modules-spice",
    "qemu-kvm",
    "qemu-utils",
    "libvirt-daemon-system",
    "libvirt-clients",
    "bridge-utils",
    "virtinst",
    "ovmf",
    # Unattended security + stable upgrades. Lives in `server` (the
    # base role) so headless boxes inherit the policy too — every
    # machine the user touches keeps itself patched without manual
    # `apt upgrade` cycles. The package alone doesn't enable anything
    # — the two post-command drop-ins below
    # (/etc/apt/apt.conf.d/20auto-upgrades and
    # /etc/apt/apt.conf.d/52unattended-upgrades-local.conf) are what
    # turn the apt-daily-upgrade.timer into an actual upgrade run.
    # Pinned by `server_role_provisions_unattended_upgrades`.
    "unattended-upgrades",
]
dotfiles = [
    ".bashrc",
    ".zshrc",
    ".zsh_aliases",
    ".zsh_alias_reminder",
    ".tmux.conf",
    ".config/yazi/**",
    ".config/nvim/**",
    ".config/starship.toml",
    ".config/theme/**",
    ".config/environment.d/**",
    ".config/containers/**",
]
post = [
    # Default the user's login shell to zsh.
    #
    # Wrapped in `sudo` deliberately. `chsh` is *not* a sudo-tool by
    # design — it's setuid-root and routes through PAM (`/etc/pam.d/chsh`
    # on Debian), which authenticates the *invoking* user against
    # `common-auth` even when they're only changing their own shell.
    # That means an unprefixed `chsh -s /bin/zsh august` interactively
    # prompts for the user's password and then reads stdin via PAM's
    # conversation function — fine on a manual run from a tty, fatal
    # for forge which invokes post-commands non-interactively. A
    # passwordless user (fresh LXC, CI test, freshly-useradded box)
    # also fails this PAM step with "Authentication failure" because
    # there is nothing for `pam_unix` to compare against.
    #
    # Going through `sudo` short-circuits the PAM auth chain entirely
    # via `pam_rootok.so` (already-root → succeed without prompt) on
    # the chsh PAM stack, and the user's NOPASSWD sudoers entry
    # (documented as the host's setup baseline) means sudo itself
    # doesn't prompt either. Net effect: forge's post-command runs
    # to completion non-interactively on the user's host, in a fresh
    # LXC, and on a Debian box where the user account was created
    # without a password — same behavior across all three.
    #
    # The `check` is unchanged: `getent passwd | grep /bin/zsh`
    # makes the post-cmd a no-op on every rerun once the user's shell
    # is already zsh. Pinned by `server_role_chsh_uses_sudo`.
    { run = "sudo chsh -s /bin/zsh $(whoami)", check = "getent passwd $(whoami) | grep -q /bin/zsh" },
    # `bat` (the apt package) ships its binary as `/usr/bin/batcat`,
    # not `bat`, because Debian's old `bacula-console-bat` package
    # historically owned `/usr/bin/bat` (Debian bug #930299, won't-
    # fix). The upstream-recommended workaround — quoted verbatim in
    # `sharkdp/bat`'s README — is to symlink the renamed binary onto
    # PATH as `bat`. Without this, the user's `cat = bat` zsh alias
    # fails on every invocation with "command not found: bat", which
    # is silly because the binary IS installed, just under a name
    # nobody types. We drop the symlink at /usr/local/bin/bat
    # (precedence over /usr/bin in the typical PATH; doesn't conflict
    # with any future apt package owning /usr/bin/bat). The dev
    # container creates the same symlink in its base.Containerfile so
    # the host and container have the same binary at the same path.
    #
    # `ln -sf` is intentional — the post-cmd is idempotent on its
    # own (reruns overwrite the existing symlink, no error), and
    # `-f` also handles the case where someone created the file
    # manually (e.g. as a script) before forge owned this path. The
    # check is `test -L`, not `test -e`, so a regular file there
    # (e.g. someone copied batcat instead of symlinked) fails the
    # check and forge re-symlinks on the next run.
    { run = "sudo ln -sf /usr/bin/batcat /usr/local/bin/bat", check = "test -L /usr/local/bin/bat" },
    # Unattended-upgrades enable file. The `unattended-upgrades`
    # package's debconf prompt asks whether to enable periodic
    # upgrades and writes /etc/apt/apt.conf.d/20auto-upgrades when
    # answered "yes". A non-interactive forge run never sees that
    # prompt, so without this drop-in the package installs but
    # apt-daily-upgrade.timer fires and exits silently every day —
    # which is the failure mode the user just left behind on this
    # box (see CLAUDE.md "How updates work").
    #
    # The four periodic knobs and what they do:
    #   * Update-Package-Lists "1"  — run `apt-get update` daily
    #     (already handled by apt-daily.timer + APT::Periodic, but
    #     pinning it explicitly stops a future package upgrade or
    #     stray edit from disabling it).
    #   * Unattended-Upgrade "1"    — actually run unattended-upgrade
    #     once per day. This is the bit that was previously absent.
    #   * AutocleanInterval "7"     — `apt-get autoclean` weekly so
    #     /var/cache/apt/archives doesn't grow unbounded with every
    #     downloaded .deb.
    #   * Download-Upgradeable-Packages "1" — pre-fetch upgrades
    #     into the cache during the daily run, so the actual
    #     unattended-upgrade pass doesn't have to download + install
    #     in one shot. Speeds up the install pass and survives flaky
    #     networks better (download retries don't block the install
    #     window).
    #
    # The `check` is `test -f` matching the logind / NM pattern — if
    # the file vanishes (someone purged unattended-upgrades and
    # reinstalled it, say) the next forge run rewrites it; if it's
    # already there we no-op.
    { run = "sudo mkdir -p /etc/apt/apt.conf.d && printf 'APT::Periodic::Update-Package-Lists \"1\";\\nAPT::Periodic::Download-Upgradeable-Packages \"1\";\\nAPT::Periodic::Unattended-Upgrade \"1\";\\nAPT::Periodic::AutocleanInterval \"7\";\\n' | sudo tee /etc/apt/apt.conf.d/20auto-upgrades >/dev/null", check = "test -f /etc/apt/apt.conf.d/20auto-upgrades" },
    # Local unattended-upgrades policy overrides. Lives at
    # /etc/apt/apt.conf.d/52unattended-upgrades-local.conf so that it
    # loads AFTER the package's shipped /etc/apt/apt.conf.d/50unattended-upgrades
    # (apt.conf.d files merge alphabetically and later definitions
    # win for scalar keys / append for list keys). We do NOT edit
    # 50unattended-upgrades directly because it's owned by the apt
    # package and would conflict on package upgrade.
    #
    # What this drop-in changes vs. shipped defaults:
    #
    #   1. **Origins-Pattern**: the package ships with security-only
    #      origins (codename + codename-security, both labeled
    #      Debian-Security). Adding the stable suite (`codename`,
    #      label Debian) and the rolling updates suite
    #      (`codename-updates`) opts the box in to point-release
    #      fixes too — e.g. when trixie 13.1 → 13.2 lands, the box
    #      picks it up overnight instead of waiting for a manual
    #      `apt upgrade`. Debian stable's update cadence is
    #      conservative enough that the user is comfortable
    #      letting these land unattended; if a specific upgrade
    #      ever breaks something, the fix is to pin that package
    #      via `apt-mark hold`, not to revert this default.
    #      The `::` operator appends to the list rather than
    #      replacing it, so the security-only entries shipped in
    #      50unattended-upgrades still apply.
    #   2. **Automatic-Reboot "false"**: defaults already false on
    #      stock Debian, but pinning the value explicitly closes
    #      off a future upstream change or a stray admin edit
    #      silently flipping it to true. The user prefers to
    #      schedule reboots themselves so a kernel upgrade
    #      doesn't drop in-progress work mid-afternoon.
    #   3. **MinimalSteps "true"**: tells unattended-upgrade to
    #      run dpkg in many small batches rather than one giant
    #      transaction. The cost is a few extra seconds per run;
    #      the benefit is that a Ctrl-C, power loss, or
    #      `apt-daily-upgrade.service` deadline kill mid-run
    #      leaves a coherent dpkg state that the *next* run
    #      resumes cleanly, instead of a half-configured package
    #      that requires manual `dpkg --configure -a`.
    #
    # The check is `test -f` for symmetry with the 20auto-upgrades
    # file above and the logind / NM drop-ins.
    { run = "sudo mkdir -p /etc/apt/apt.conf.d && printf '// Local overrides on top of /etc/apt/apt.conf.d/50unattended-upgrades.\\n// Loaded after 50 (apt merges conf.d alphabetically); managed by forge.\\n\\nUnattended-Upgrade::Origins-Pattern:: \"origin=Debian,codename=${distro_codename},label=Debian\";\\nUnattended-Upgrade::Origins-Pattern:: \"origin=Debian,codename=${distro_codename}-updates\";\\nUnattended-Upgrade::Automatic-Reboot \"false\";\\nUnattended-Upgrade::MinimalSteps \"true\";\\n' | sudo tee /etc/apt/apt.conf.d/52unattended-upgrades-local.conf >/dev/null", check = "test -f /etc/apt/apt.conf.d/52unattended-upgrades-local.conf" },
    { run = "ln -sf $HOME/.local/nvim/bin/nvim $HOME/.local/bin/nvim", check = "test -L $HOME/.local/bin/nvim" },
    { run = "sudo ln -sf /usr/bin/batcat /usr/local/bin/bat", check = "test -L /usr/local/bin/bat" },
    { run = "sudo ln -sf /usr/bin/fdfind /usr/local/bin/fd", check = "test -L /usr/local/bin/fd" },
    { run = "sudo ln -sf $HOME/.local/bin/yazi /usr/local/bin/yazi", check = "test -L /usr/local/bin/yazi" },
    { run = "sudo ln -sf $HOME/.local/bin/ya /usr/local/bin/ya", check = "test -L /usr/local/bin/ya" },
    { run = "sudo ln -sf $HOME/.local/bin/starship /usr/local/bin/starship", check = "test -L /usr/local/bin/starship" },
    # Virt stack group memberships. Add the user to each of the
    # four groups that gate the runtimes the vm-menu script (Mod+c)
    # talks to:
    #
    #   * `incus-admin` — owners can run `incus admin init` and
    #     edit daemon-wide config. Strictly only needed for the
    #     init step right below this block, but adding it on every
    #     host means a future `forge teardown && forge setup` cycle
    #     keeps re-init authoritative without sudo.
    #   * `incus`       — daily-use group. Members can `incus
    #     launch`, `incus exec`, `incus list`, etc. without sudo.
    #     The vm-menu script runs as the user, so this is what
    #     makes the menu's incus calls work.
    #   * `libvirt`     — connects to `qemu:///system` without
    #     sudo. The vm-menu hard-codes `qemu:///system` because
    #     `qemu:///session` (the per-user, no-libvirtd default)
    #     can't reach the libvirt-managed `virbr0` network — every
    #     VM defined there would otherwise be invisible to the
    #     menu, so this group is load-bearing.
    #   * `kvm`         — owns /dev/kvm. Modern libvirt setups
    #     don't strictly require the user to be in `kvm` (the
    #     libvirtd helper opens /dev/kvm), but membership lets us
    #     run qemu directly for ad-hoc debugging without sudo —
    #     handy when libvirtd itself is the thing you're trying
    #     to diagnose.
    #
    # `usermod -aG` is itself idempotent (re-affirms an existing
    # membership without error), so the per-line `check` is a
    # belt-and-braces short-circuit so reruns don't re-shell out
    # through sudo. The check parses /etc/group via getent, which
    # reflects what usermod just wrote without round-tripping
    # through the user's session — important because newly-added
    # group memberships don't take effect for the *current*
    # session at all (they only attach to processes started after
    # a re-login or a `newgrp`). See CLAUDE.md for the user-facing
    # consequence: vm-menu shell actions can't talk to
    # incus/libvirt until the user logs out + back in after the
    # very first `forge setup` that adds them to these groups.
    { run = "sudo usermod -aG incus-admin $(whoami)", check = "getent group incus-admin | grep -qw $(whoami)" },
    { run = "sudo usermod -aG incus $(whoami)", check = "getent group incus | grep -qw $(whoami)" },
    { run = "sudo usermod -aG libvirt $(whoami)", check = "getent group libvirt | grep -qw $(whoami)" },
    { run = "sudo usermod -aG kvm $(whoami)", check = "getent group kvm | grep -qw $(whoami)" },
    # Enable libvirtd. Debian's libvirt-daemon-system postinst
    # usually starts the unit on install, but `enable --now` is
    # defensive: a package-mgr crash mid-install or a manual
    # `systemctl stop libvirtd` during debugging would otherwise
    # leave the daemon down on the next forge run, breaking every
    # `virsh` call from the vm-menu silently. The check matches
    # the NetworkManager / bluetooth.service pattern above —
    # `is-active` rather than `is-enabled` so a manually-stopped
    # daemon gets brought back up by the next forge run rather
    # than being silently left down because the symlink already
    # exists.
    { run = "sudo systemctl enable --now libvirtd.service", check = "systemctl is-active --quiet libvirtd.service" },
    # Defensively register the `default` NAT network with libvirtd
    # if it's not already defined.
    #
    # libvirt-daemon-system's postinst *usually* imports the seed
    # XML at `/etc/libvirt/qemu/networks/default.xml` into libvirtd's
    # runtime state on first start — but not always. We caught a
    # real host (the developer's daily driver) in a state where the
    # XML existed on disk but `virsh net-list --all` showed no
    # networks at all, which means the next two post-commands
    # (`net-autostart`, `net-start`) silently fail with
    # `error: failed to get network 'default'` and the entire
    # vm-menu libvirt path is dead until someone runs
    # `virsh net-define` by hand.
    #
    # The fix is two-line: this post-cmd defines the network from
    # the seed XML if it's not already in libvirtd's state, and the
    # check below it (`net-list --all --name | grep -qx default`)
    # makes reruns idempotent — once the network is registered, the
    # define command never runs again. Order matters: this MUST run
    # before the autostart + start post-commands below, otherwise
    # those will hit the same "no network 'default'" error on a
    # clean install where the postinst didn't auto-import.
    #
    # The XML path is the same one Debian's libvirt-daemon-system
    # ships and is documented in `man virsh`: it's a stable
    # interface within the package's lifetime. If a future libvirt
    # release moves it, this command's exit-status-1 surfaces the
    # change immediately rather than silently masking it. Pinned by
    # `server_role_defines_libvirt_default_network`.
    { run = "sudo virsh net-define /etc/libvirt/qemu/networks/default.xml", check = "sudo virsh net-list --all --name 2>/dev/null | grep -qx default" },
    # Mark libvirt's `default` NAT network (the `virbr0` bridge)
    # autostart, so VMs don't fail with "network 'default' is not
    # active" after every host reboot. The check parses
    # `virsh net-info default` for the `Autostart: yes` line —
    # that's exactly the field `--autostart` flips, so checking it
    # directly avoids relying on a separate state file. The
    # `net-define` post-cmd above ensures the network exists in
    # libvirtd's state before this runs.
    { run = "sudo virsh net-autostart default", check = "sudo virsh net-info default 2>/dev/null | grep -q '^Autostart:.*yes'" },
    # Bring the default network up in the *current* session as
    # well, since `net-autostart` only takes effect on the next
    # libvirtd start. Without this, the very first vm-menu
    # invocation on a fresh box (before the next reboot) hits
    # "network 'default' is not active" and every VM start fails.
    # Separate command from net-autostart because the two flags
    # do orthogonal things — autostart is persistence, net-start
    # is "now". The check parses the `Active: yes` line, mirror
    # of the autostart check above.
    { run = "sudo virsh net-start default", check = "sudo virsh net-info default 2>/dev/null | grep -q '^Active:.*yes'" },
    # Restart the incus daemon so it re-runs its qemu feature
    # checks against the now-installed OVMF firmware. The daemon
    # probes for `/usr/share/OVMF/OVMF_CODE.fd` ONCE at startup
    # and caches the result; if `incus` was installed (and the
    # postinst auto-started incus.service) before `ovmf` landed
    # in the same forge run, the cached state is "no UEFI → VM
    # driver non-operational", and `incus init --vm` then errors
    # with "Instance type 'virtual-machine' is not supported on
    # this server: QEMU failed to run feature checks" *despite*
    # qemu/kvm being installed. A restart re-probes and clears
    # the cache.
    #
    # Idempotency: a marker file under /var/lib/incus/. We write
    # `.forge-uefi-restart-done` after a successful restart and
    # short-circuit on its presence in subsequent runs. This
    # avoids two failure modes the previous mtime-comparison
    # approach had:
    #
    #   1. `/proc/<pid>` mtime is NOT a reliable
    #      "process started at" signal on Linux — the proc
    #      filesystem refreshes mtimes on access for many
    #      entries, so the comparison evaluated false on every
    #      rerun and the restart fired *every time*. On a
    #      workstation with a running incus VM, that's
    #      especially bad: systemd's incus.service stop drains
    #      all managed instances first, so the restart hangs
    #      for the VM's full ACPI-shutdown timeout (up to 30
    #      minutes per `boot.host_shutdown_timeout`). One real
    #      incident: forge setup hung for ~20 min waiting for a
    #      live test VM to shut down because of this bug.
    #   2. Marker is unambiguous: if the file exists, the
    #      restart has been done at least once on this host
    #      after ovmf was reachable. No date arithmetic, no
    #      proc inspection, no daemon API calls (which would
    #      need incus-admin group membership the user may not
    #      have on the *current* session yet — the documented
    #      "log out + back in" gotcha).
    #
    # The `&&` chain ensures the marker is only written if the
    # restart itself succeeded. /var/lib/incus is created by the
    # incus package's postinst before this post-cmd runs, so we
    # don't need to mkdir.
    { run = "sudo sh -c 'systemctl restart incus.service && touch /var/lib/incus/.forge-uefi-restart-done'", check = "test -f /var/lib/incus/.forge-uefi-restart-done" },
    # Initialize incus with the auto/default config: a `dir`-
    # backend storage pool at /var/lib/incus, an `incusbr0` bridge
    # for the default profile, and a `default` profile wired up.
    # Without this, `incus launch <image>` errors with "no storage
    # pool defined" on a fresh box. We pin `--storage-backend=dir`
    # rather than letting `--auto` pick because trixie ships
    # tooling for ZFS / BTRFS that can change `--auto`'s mind from
    # one release to the next, and we want every host using the
    # same storage shape so the docs and the `vm-menu` UX stay
    # predictable. (Filesystem-level snapshots from ZFS/BTRFS
    # would be nice, but they're worth a dedicated decision
    # later, not a silent default.)
    #
    # The check is load-bearing, not just a perf optimization:
    # rerunning `incus admin init` against an already-initialized
    # daemon errors out with "You have existing instances or
    # images. 'incus admin init' requires an empty database.", so
    # without the check every forge rerun fails at this step.
    # `/var/lib/incus/database` only exists once init has
    # succeeded, so it's a faithful "is incus initialized" probe.
    { run = "sudo incus admin init --auto --storage-backend=dir", check = "test -d /var/lib/incus/database" },
    # Host firewall: deliberately none.
    #
    # An earlier version of this role created an `inet forge_filter`
    # nftables table with `policy drop` on input plus a small
    # allowlist (lo / established,related / icmp / ssh). On paper
    # that's the canonical default-deny posture. In practice it
    # broke rootless podman + pasta UDP DNS replies on this kernel:
    # pasta sends DNS queries through host sockets and the replies
    # come back into the host's input chain, but `ct state
    # established,related accept` did NOT match those replies
    # reliably. Symptom: `forge dev build` failed at the very first
    # `apt-get update` with `Temporary failure resolving
    # 'deb.debian.org'` even though the host could curl the same
    # URL fine, and a one-off `podman run --dns=10.10.20.1
    # debian:trixie-slim getent hosts deb.debian.org` reproduced
    # the failure 100% of the time. Same command with
    # `--network=host` (which bypasses pasta and skips the host's
    # input chain entirely) succeeded.
    #
    # Reasoning for dropping the firewall instead of working
    # around the pasta breakage:
    #
    #   * This is a single-user developer laptop behind a NAT
    #     router. Inbound traffic from the public internet is
    #     already filtered by the router's NAT — packets to the
    #     laptop's WAN-facing IP that don't match an outbound
    #     connection get dropped at the router, not the laptop.
    #   * Services on Debian default to binding `127.0.0.1` /
    #     `::1`, not `0.0.0.0`. The notable exceptions are the
    #     ones we *want* reachable on the LAN (sshd, the libvirt
    #     bridge for VM consoles, future incus setups) — and a
    #     default-drop firewall just made those harder to use
    #     without giving meaningful protection.
    #   * The LAN itself is trusted (the user's home network).
    #   * Distro defaults — Debian, Ubuntu workstation, Fedora
    #     workstation — all ship with no host-level filtering on
    #     a fresh install. Our forge_filter was layering on top of
    #     a sensible default to no benefit.
    #
    # We still write `/etc/nftables.conf` to a forge-managed
    # marker so the path is owned (an ad-hoc edit can't squat it),
    # and we still pin a negative invariant against `flush ruleset`
    # in `server_role_provisions_host_firewall` because **even an
    # empty/comment-only file with `flush ruleset` would wipe
    # netavark / libvirt / incus tables** when nftables.service
    # loads it. The rest of the file is comments — no rules, no
    # tables, just documentation of why this file is intentionally
    # empty.
    #
    # `nftables.service` is left as Debian shipped it (loaded but
    # mostly inert against this empty config). We don't disable
    # the service because netavark/libvirt/incus run `nft` against
    # the same kernel subsystem; pulling the package or masking
    # the service would risk surprising those daemons. With the
    # file empty, the service starts, loads no rules, and gets out
    # of the way.
    #
    # If a future host actually needs inbound filtering (e.g.
    # exposing this laptop as a real server somewhere), don't
    # restore `forge_filter` directly — investigate the pasta
    # interaction first, since whatever rule shape we end up with
    # has to coexist with rootless podman's DNS path. The original
    # forge_filter design is preserved in git history as a
    # starting point.
    { run = "printf '#!/usr/sbin/nft -f\\n# Managed by forge: intentionally empty.\\n#\\n# A previous forge_filter table was rolled back — see\\n# config/roles.toml for the full rationale (rootless podman +\\n# pasta UDP DNS replies were not matching `ct state established`\\n# in our input chain, breaking `forge dev build` at apt-get\\n# update). On a single-user laptop behind NAT this filter was\\n# net-negative anyway; the kernel-side firewall now defers to\\n# distro defaults (no filtering).\\n#\\n# Do NOT add a global ruleset reset to this file (the Debian\\n# default did exactly that, which would wipe netavark / libvirt /\\n# incus tables on every nftables reload — pinned by a negative\\n# invariant in server_role_provisions_host_firewall).\\n' | sudo tee /etc/nftables.conf >/dev/null && sudo systemctl reload nftables.service 2>/dev/null || true", check = "grep -q '^# Managed by forge: intentionally empty' /etc/nftables.conf" },
]

[[server.downloads]]
name = "neovim"
url = "https://github.com/neovim/neovim/releases/latest/download/nvim-linux-x86_64.tar.gz"
dest = "~/.local/nvim"
extract = "tree:1"

[[server.downloads]]
name = "starship"
url = "https://github.com/starship/starship/releases/latest/download/starship-x86_64-unknown-linux-gnu.tar.gz"
