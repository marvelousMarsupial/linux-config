[desktop]
extends = "server"
packages = [
    # Compositor + core
    "sway",
    "swaylock",
    "swayidle",
    "foot",
    "fuzzel",
    "mako-notifier",
    "wl-clipboard",
    "cliphist",
    # kanshi: monitor hotplug daemon. Watches sway's output events and
    # applies one of the profiles in ~/.config/kanshi/config based on
    # which displays are currently connected. This is what makes "plug
    # in two externals and have the laptop screen turn off, unplug
    # them and the laptop screen comes back" work without manual
    # `swaymsg output ...` invocations.
    "kanshi",
    # Qt5 wayland plugin — KeePassXC needs it. Without it, Qt apps fail
    # with "Could not find the Qt platform plugin wayland" and exit
    # silently when launched from fuzzel. Skipping qt6-wayland for now
    # (no Qt6 apps in the role and it pulls in ~40MB of Qt6 runtime).
    "qtwayland5",
    # X11 fallback for legacy/Electron apps that don't speak Wayland.
    "xwayland",
    # Provides `gtk-launch`, used by sway binds to invoke .desktop entries
    # (the most reliable way to launch flatpak apps with their --command/
    # --file-forwarding flags applied).
    "libgtk-3-bin",
    # Notifications, fonts, icons
    "fontconfig",
    "libnotify-bin",
    "hicolor-icon-theme",
    "adwaita-icon-theme",
    # Color emoji glyphs. Without this, every emoji codepoint in
    # the system (browser tabs, notifications, mako popups, chat
    # apps, file/folder names with emoji prefixes) renders as the
    # missing-glyph "tofu" box — even though the underlying string
    # is correct. Debian ships fontconfig rules in this package's
    # postinst that add it as the fallback for the Unicode emoji
    # block, so installing the package is enough; no manual
    # fontconfig snippet is needed.
    "fonts-noto-color-emoji",
    # Network + power + media
    "network-manager",
    "wireless-tools",
    "brightnessctl",
    "playerctl",
    "wireplumber",
    # Power-profiles-daemon: laptop power management. Sits at the
    # sweet spot for a Wayland / sway desktop because:
    #
    #   * It exposes three profiles (`power-saver`, `balanced`,
    #     `performance`) over D-Bus, switchable via
    #     `powerprofilesctl set <profile>` with no reboot/relogin.
    #     Tweaks the Intel P-state EPP, platform_profile (when the
    #     firmware exposes one — Tiger Lake i7-1185G7 does), and
    #     the CPU governor in lockstep. On battery-only metrics
    #     it's not as aggressive as TLP, but it integrates cleanly
    #     with UPower (battery state hooks) and avoids TLP's habit
    #     of hard-coding policies that fight with kernel power
    #     management.
    #   * Pure system service, no desktop-environment specifics —
    #     works the same under sway/Wayland, gnome, kde. We don't
    #     need anything sway-specific here.
    #   * Default profile on install is `balanced`, which is the
    #     right neutral starting point. The user changes it via
    #     `powerprofilesctl` (CLI) or D-Bus (any future status-bar
    #     widget). We don't pin a default profile in this role —
    #     auto-switching on AC plug/unplug is a polish task that
    #     the user can opt into separately (PPD doesn't auto-switch
    #     by design; if you want that, you wire it up via a UPower
    #     dispatcher or sway hook).
    #
    # Lives in **desktop**, not server, because every knob it
    # exposes is laptop-shaped (battery thresholds, EPP transitions,
    # platform_profile). On a server-on-AC the daemon would just
    # idle in `balanced` and burn ~5 MiB RAM for nothing. Pinned
    # by `desktop_role_provisions_power_profiles_daemon` so a
    # future "I don't need this" edit can't silently strip it.
    "power-profiles-daemon",
    # PipeWire's PulseAudio API shim. Without this the PipeWire daemon
    # is fine and native-PipeWire callers (`pw-cat`, the dictate
    # script's `pw-record`) work, but anything speaking the
    # PulseAudio protocol (browsers, media players, basically every
    # app using libpulse) has nothing listening at
    # $XDG_RUNTIME_DIR/pulse/native and goes silent. We hit this
    # exact failure mode — dictation worked, browser audio didn't —
    # which is what prompted adding the package to the role. Pulls
    # in `pipewire` and `pipewire-bin` as deps, so they don't need
    # to be listed explicitly.
    "pipewire-pulse",
    # ALSA userspace tools — `alsamixer`, `aplay`, `arecord`,
    # `speaker-test`. None of the role's automated post-commands need
    # these, but troubleshooting "no audio" without them is awful:
    # there's no way to inspect the hardware mixer state, list cards,
    # or play a test tone from the shell. Worth the ~1 MiB to have
    # them on hand the next time something goes wrong.
    "alsa-utils",
    # RTKit lets PipeWire request realtime scheduling priority for
    # its audio threads. Without it PipeWire logs `RTKit error:
    # org.freedesktop.DBus.Error.ServiceUnknown` at startup, falls
    # back to nice level 0, and audio is more prone to crackle and
    # dropouts when the CPU is under load (background compiles,
    # browser tab heavy, etc). The rtkit daemon is a tiny system
    # service that mediates realtime requests from unprivileged
    # processes — it's dbus-activated, so installing the package is
    # enough to make it available the next time PipeWire reconnects;
    # no explicit `systemctl enable` is needed in the post section.
    "rtkit",
    "udiskie",
    # Bluetooth
    "bluez",
    "blueman",
    # PipeWire's BlueZ SPA plugin — the bridge that lets wireplumber
    # route audio streams to/from BT devices (A2DP for headsets,
    # HSP/HFP for headsets-with-mic). Without it wireplumber logs
    # `PipeWire's BlueZ SPA plugin is missing or broken. Bluetooth
    # devices will not be supported.` at startup; pairing a BT audio
    # device via blueman appears to succeed (it shows up as a paired
    # device) but PipeWire never produces a sink/source for it, so
    # there is no way to actually play or record audio over the
    # connection. This is a separate package from `bluez` because
    # the bluez stack itself is protocol-only — the SPA bridge is
    # what makes BT visible to PipeWire.
    "libspa-0.2-bluetooth",
    # Screenshots
    "grim",
    "slurp",
    # Portals (file pickers, screen share for Flatpak apps)
    "xdg-desktop-portal-gtk",
    # Status panel ASCII clock + system monitor
    "toilet",
    "btop",
    # Lazygit — git TUI bound to the host shell alias `lg`. We install
    # via apt rather than from upstream's GitHub releases because the
    # `/releases/latest/download/lazygit_X.Y.Z_Linux_x86_64.tar.gz` URL
    # pattern bakes the version into the filename, so any new upstream
    # release 404s the previously-pinned URL until the version digit is
    # bumped here. Debian trixie ships lazygit at a recent enough
    # version (0.50+) that the apt source is the lower-maintenance
    # path; if we ever need a feature only on the bleeding edge we can
    # switch back to a tarball download then.
    "lazygit",
    # Password managers
    "pass",
    "keepassxc",
    # Flatpak runtime for zen browser + obsidian
    "flatpak",
    # Dictation stack. wtype synthesizes the Ctrl+V paste used by the
    # `dictate` script; we deliberately route the transcription through
    # the clipboard rather than typing char-by-char so unicode and
    # long results land instantly. wl-clipboard (above) is what holds
    # the text between wl-copy and the synthesized paste.
    "wtype",
    # cmake — kept on desktop role as a generally-useful Linux build
    # tool. We no longer use it for the whisper.cpp build (those
    # binaries are now vendored prebuilt — see
    # `dotfiles/.local/bin/whisper-server`), but it's small and the
    # kind of thing a Linux desktop expects to have available for
    # ad-hoc work.
    "cmake",
    # virt-manager — GTK GUI front-end for libvirt. Lives in the
    # desktop role only because the underlying daemons + CLIs
    # (libvirtd, virsh, qemu-system-x86, virtinst) are already in
    # the `server` base role; desktop just adds the graphical
    # console viewer on top. Two reasons it earns its slot:
    #
    #   1. SPICE/VNC console for VMs that don't have a serial
    #      console configured — `virsh console <name>` only works
    #      if the guest XML declares `<console type='pty'>` AND a
    #      getty is running on the matching tty inside the guest.
    #      Legacy / minimal guest images often lack one or both,
    #      and virt-manager's graphical viewer is the only
    #      practical way to get a shell into them on this host
    #      (no other VNC/SPICE client is installed). The vm-menu
    #      script's `shell` action falls back to "console may
    #      hang — open virt-manager" in that case.
    #   2. ISO install flow. `virt-install --cdrom` works fine
    #      headless, but watching the installer's graphical pane
    #      tick through partitioning is much faster to debug
    #      visually than tailing a serial log. virt-manager's
    #      "create new VM" wizard wires up sane defaults (UEFI
    #      firmware, virtio block, virtio net) without making
    #      the user remember the flag soup.
    #
    # The SPICE GTK widget bindings (`gir1.2-spiceclientgtk-3.0`)
    # are pinned explicitly below — they are a *Recommends* of
    # virt-manager, NOT a Depends, and forge installs with
    # `--no-install-recommends` (see `crates/common/src/packages.rs`),
    # so without an explicit listing the GIR namespace is missing
    # at runtime and opening any guest's console errors with
    # "Error opening SPICE console: Namespace SpiceClientGtk not
    # available". The viewer pane in virt-manager is then dead on
    # arrival on a fresh install — exactly the case this role is
    # meant to handle for VMs without a serial console.
    "virt-manager",
    "gir1.2-spiceclientgtk-3.0",
    # virt-viewer — apt package shipping both the `virt-viewer` GTK
    # binary and the `remote-viewer` CLI. Complements virt-manager:
    # virt-manager is the heavier "browse + manage all my libvirt
    # guests" UI; virt-viewer / remote-viewer are the lightweight
    # "open a console for THIS specific URL" tools.
    #
    # The trigger for this addition was `incus console <name>
    # --type=vga` shelling out to `remote-viewer` to render the
    # SPICE display of an incus VM — without virt-viewer installed,
    # the command silently fails with "remote-viewer not found"
    # (or in some incus versions, opens nothing). With it, the SPICE
    # window pops as expected. Same binary is also useful when you
    # have a libvirt SPICE socket URL in hand
    # (`spice+unix:///var/run/libvirt/...`) — `remote-viewer
    # spice+unix://...` opens it without going through virt-manager's
    # full guest-list UI.
    #
    # Side-shows the dbind/AT-SPI accessibility-bus warning at
    # startup ("Error retrieving accessibility bus address: …
    # org.a11y.Bus") — that's harmless and standard for any
    # GTK-on-sway app where the a11y bus isn't running, not a
    # configuration mistake on our end. Pinned by
    # `desktop_role_provisions_virt_console_tools`.
    "virt-viewer",
]
dotfiles = [
    ".config/sway/**",
    ".config/foot/**",
    ".config/fuzzel/**",
    ".config/gtk-3.0/**",
    ".config/gtk-4.0/**",
    # kanshi monitor-hotplug profiles. Without this glob the role
    # installs the kanshi binary but ships no profile file, leaving
    # the daemon idle and forcing sway's static output config (which
    # we have since deliberately removed) to take over. The combo of
    # "kanshi installed but unconfigured" silently broke the docked
    # layout, so the glob is required, not optional.
    ".config/kanshi/**",
    # systemd --user units. Currently this glob ships only the
    # whisper-server.service unit used by the `dictate` keybind.
    # The unit deliberately has no [Install] section: it's lazy-
    # started on first dictation by the script and stopped on
    # demand via `dictate stop-server`, so enabling it at boot
    # would waste ~1.7 GiB of RAM on the medium.en model load.
    ".config/systemd/user/**",
    ".local/share/applications/**",
    ".local/bin/**",
]
post = [
    # NOTE: the rustup install + clippy/rustfmt component-add steps that
    # used to live here are gone. The host no longer carries a Rust
    # toolchain — rebuilding `forge` happens in a dev container
    # (`forge dev up forge-build`), the resulting binary gets `podman
    # cp`'d onto the host. This keeps the desktop free of ~/.cargo and
    # ~/.rustup (each of which is several hundred MiB by the time it
    # has clippy + rustfmt + rust-analyzer + a stable toolchain), and
    # is the same pattern we use for whisper.cpp (vendored prebuilt
    # binaries, build-time tooling lives in containers).
    { run = "fc-cache -f ~/.local/share/fonts", check = "fc-list | grep -qi 'CaskaydiaCove Nerd Font'" },
    # NetworkManager: required by wifi-menu (bound to $mod+w) and by
    # nm-applet status integrations. Debian's network-manager apt
    # postinst usually enables this for us, but `--now` guarantees the
    # daemon is running on first boot too — without it, wifi-menu just
    # notifies "NetworkManager not running" and exits, which has been a
    # confusing failure mode on fresh installs in the past.
    # The `check` is `is-active` rather than `is-enabled` so that a
    # manually-stopped daemon (e.g. during debugging) gets restarted on
    # the next forge rerun instead of being silently left down.
    { run = "sudo systemctl enable --now NetworkManager", check = "systemctl is-active --quiet NetworkManager" },
    # Migrate networking off ifupdown + dhcpcd onto NetworkManager —
    # one manager owns every device. Three post-commands, each
    # idempotent. The shipping Debian default is split: NM manages
    # wifi, ifupdown (via networking.service) shells out to
    # dhcpcd-base for any device declared in /etc/network/interfaces.
    # That arrangement bit us with the ethernet-priority work in
    # this same role: NM's `[connection-ethernet]` route-metric
    # default applies only to NM-managed connections, and the wire
    # was unmanaged (state shown by `nmcli device status` as
    # `unmanaged`), so dhcpcd's metric=1006 on enxXXX won the
    # default-route race against NM's wifi at metric=600. Symptom:
    # ethernet plugged in, ethernet has carrier + DHCP lease,
    # traffic still goes over wifi.
    #
    # The fix is structural, not a metric tweak: hand the wire to
    # NM. With one manager, the existing 10-ethernet-priority.conf
    # drop-in (one post-command below) actually does its job, and
    # the MAC-derived interface name (`enxc8a362b69f16` etc.) is no
    # longer hardcoded in /etc/network/interfaces — different USB
    # ethernet dongle / dock = NM auto-detects, no edits.
    #
    # Step 1: tell NM not to cede ifupdown-listed devices. Debian's
    # /etc/NetworkManager/NetworkManager.conf ships
    # `[ifupdown] managed=false`, which is what made the wire
    # unmanaged. We override via a conf.d/ drop-in (preferred over
    # editing the package-owned main file, which would conflict on
    # apt upgrades). The 05- prefix loads BEFORE 10-ethernet-priority.conf
    # so NM has decided to manage the wire by the time the priority
    # block applies.
    { run = "sudo mkdir -p /etc/NetworkManager/conf.d && printf '[ifupdown]\\nmanaged=true\\n' | sudo tee /etc/NetworkManager/conf.d/05-ifupdown-managed.conf >/dev/null", check = "test -f /etc/NetworkManager/conf.d/05-ifupdown-managed.conf" },
    # Step 2: strip /etc/network/interfaces down to loopback only.
    # The original Debian-installer-written file contains an
    # `iface enxXXXXXXXXXXXX inet dhcp` block keyed off the MAC
    # address of whatever USB ethernet adapter was plugged in at
    # install time — brittle (different dongle = wrong name) and
    # redundant once NM owns every device. We keep `lo` because
    # NM doesn't manage loopback by default (it shows up as
    # `connected (externally)` in `nmcli device status`) and the
    # kernel auto-configures it from this declaration anyway.
    #
    # The leading `# Managed by forge:` comment is load-bearing for
    # the `check`: rather than diff the whole file content (fragile)
    # or count lines (also fragile), we look for the marker as a
    # signal that this file has been through a forge run. If a
    # future re-image of Debian writes a different /etc/network/
    # interfaces, the marker will be missing and forge will rewrite.
    { run = "printf '# Managed by forge: only loopback lives here, NetworkManager owns every other device.\\n# Adding an iface block here re-introduces an ifupdown / dhcpcd manager that\\n# competes with NM for whatever device you list — see roles.toml for the full story.\\nauto lo\\niface lo inet loopback\\n' | sudo tee /etc/network/interfaces >/dev/null", check = "grep -q '^# Managed by forge' /etc/network/interfaces" },
    # Step 3: disable networking.service. With /etc/network/interfaces
    # down to just loopback (which the kernel brings up itself) the
    # ifupdown unit has nothing useful to do, and leaving it enabled
    # means the next apt upgrade or stray edit can re-introduce a
    # competing manager for any new interface declared. `disable
    # --now` both stops the running unit (ending the dhcpcd lease
    # ifupdown was holding on the wire) and removes the
    # multi-user.target.wants/ symlink so it doesn't restart at
    # next boot.
    #
    # The check is `! is-enabled` rather than `is-disabled` because
    # systemd reports `disabled` for both genuinely-disabled units
    # and never-installed ones; a missing networking.service unit
    # file (e.g. on a future Debian variant that drops ifupdown)
    # should also be a no-op, not a forge failure. `is-enabled
    # --quiet` exits 0 only when actively enabled, so the negation
    # short-circuits correctly in both states.
    { run = "sudo systemctl disable --now networking.service", check = "! systemctl is-enabled --quiet networking.service" },
    # NetworkManager wired-vs-wireless route preference. NM ships
    # per-device-type metric defaults — ethernet=100, wifi=600 — and
    # the kernel picks the lower metric for the default route, which
    # is why a freshly-installed Debian box already prefers the wire
    # when both interfaces are up. Pinning the same values via a
    # drop-in at /etc/NetworkManager/conf.d/10-ethernet-priority.conf
    # is mostly belt-and-braces: the numbers match NM's compiled
    # defaults, but those defaults live only as in-code constants
    # (no on-disk config to diff), so a silent NM upstream change or
    # a stray admin edit to a connection profile
    # (`ipv4.route-metric=200` on the wifi profile, say) could
    # quietly flip the preference. The drop-in makes the intent
    # explicit and reproducible across boxes.
    #
    # We deliberately do NOT include `connection.autoconnect-priority`
    # in this drop-in. Per `nm-settings(5)`, that property only
    # chooses between *multiple profiles competing for the same
    # device* (e.g. two saved wifi networks both autoconnect-eligible
    # on wlan0). It does NOT influence cross-device preference —
    # ethernet and wifi are different devices and both autoconnect
    # independently when their carrier comes up. The version of this
    # drop-in that pinned `autoconnect-priority=100` on
    # `[connection-ethernet]` and `-10` on `[connection-wifi]` was
    # dead config: it never affected which interface activated
    # first, and routing was already correct via the metrics. We
    # also observed Debian's NM auto-generate the default
    # "Wired connection 1" with `autoconnect-priority=-999` (NM's
    # default-wired sentinel — set so any user-created wired profile
    # at the default 0 outranks it on the same device), which would
    # have inverted our intent if the property had actually been
    # cross-device. Removing it removes the confusion.
    #
    # The actual exclusive-failover behavior the user wants —
    # "ethernet when plugged in, wifi only when not" — is
    # implemented by the dispatcher script post-cmd that immediately
    # follows this one. The route-metric pin alone is not enough on
    # a host where wifi and ethernet share a subnet (RFC 6724
    # source-address selection bypasses route metric for outbound
    # binds); see the dispatcher block comment for the full story.
    #
    # `match-device=type:ethernet` / `type:wifi` is the documented
    # NMSettingMatch syntax (see `man NetworkManager.conf`, the
    # [connection-*] section). It applies as a *default* — a
    # connection profile that explicitly sets its own
    # `ipv4.route-metric` overrides this drop-in, which is the right
    # escape hatch for the rare "I want this one wifi to win" case.
    #
    # `nmcli general reload conf` is the surgical way to pick up
    # conf.d changes without bouncing the daemon — it re-reads
    # NetworkManager.conf + everything in conf.d/ and applies the
    # new defaults to subsequent activations. Existing in-flight
    # connections keep their current metric until the next
    # `nmcli connection up <name>` reactivation.
    #
    # The check has two halves: `test -f` on the conf.d path and
    # a *negated* `grep -q autoconnect-priority` against it. The
    # second half is the migration guard: we used to ship this
    # drop-in with `connection.autoconnect-priority=100`/`-10`
    # blocks (dead config, see comment above), and a plain
    # `test -f` would let an old version of the file linger
    # forever because the path exists. Negated grep failing on
    # `autoconnect-priority` forces the rewrite when forge runs
    # against a host that has the deprecated body. On a fresh
    # box or a host that has already been migrated, both halves
    # pass and the post-cmd is a no-op.
    { run = "sudo mkdir -p /etc/NetworkManager/conf.d && printf '[connection-ethernet]\\nmatch-device=type:ethernet\\nipv4.route-metric=100\\nipv6.route-metric=100\\n\\n[connection-wifi]\\nmatch-device=type:wifi\\nipv4.route-metric=600\\nipv6.route-metric=600\\n' | sudo tee /etc/NetworkManager/conf.d/10-ethernet-priority.conf >/dev/null && sudo nmcli general reload conf", check = "test -f /etc/NetworkManager/conf.d/10-ethernet-priority.conf && ! grep -q autoconnect-priority /etc/NetworkManager/conf.d/10-ethernet-priority.conf" },
    # NetworkManager dispatcher: exclusive ethernet-preferred failover.
    #
    # Why a dispatcher and not just the route-metric drop-in above:
    # NM's per-device-type defaults already pin ethernet at metric
    # 100 vs wifi at 600, and the kernel's default-route lookup
    # correctly picks ethernet for outbound packets. But on a host
    # where wifi and ethernet share the same /24 (common docking
    # scenario — laptop plugged into a dock that connects to the
    # same LAN the wifi AP is on), `getaddrinfo()` / `connect()`
    # source-address selection per RFC 6724 picks the lower-ifindex
    # interface for same-subnet destinations, NOT the route metric.
    # Wifi often has the lower ifindex (it associates earlier in
    # boot), so app-level outbound binds end up using the wifi IP
    # even though the kernel routes through ethernet — and the
    # remote peer's reply packets follow the source address back
    # over wifi. Symptom: VPN client reports wifi as the active
    # interface, `curl ifconfig.me` shows the wifi public IP, etc.,
    # despite the wire being plugged in and "preferred" by metric.
    # See RFC 6724 §6 and the kernel's `inet_select_addr` (in
    # `Documentation/networking/ip-sysctl.rst`).
    #
    # The structural fix when same-subnet dual-homing is in play is
    # exclusive failover: wifi gets disconnected when an ethernet
    # device comes up, and reconnected when the last ethernet device
    # goes down. NM has no built-in property for this (Fedora/Ubuntu
    # ship the same UX via desktop-environment plumbing or a
    # dispatcher hook; macOS does it in CoreWLAN), so we drop a
    # tiny shell script into NM's dispatcher.d/ that NM invokes for
    # every device transition.
    #
    # Script behavior:
    #   * On any `en*` / `eth*` device transitioning to `up`: walks
    #     every wifi device on the box and runs `nmcli device
    #     disconnect <dev>`. That puts the wifi device in the
    #     manually-disconnected state (NM won't auto-reactivate
    #     until told to), and crucially does not touch the radio
    #     rfkill — `iwlist scan` still works, the user can still
    #     pick a different wifi network manually if they want to
    #     override the dispatcher (`nmcli device connect <wifi>`).
    #   * On any `en*` / `eth*` device transitioning to `down`: if
    #     another ethernet connection is still active, no-op (a
    #     docked laptop with two wired interfaces shouldn't
    #     un-disable wifi just because one cable was unplugged).
    #     If no ethernet is active, run `nmcli device connect <dev>`
    #     for every wifi device — that lifts the
    #     manually-disconnected flag and lets NM autoconnect the
    #     highest-autoconnect-priority eligible wifi profile on
    #     that device.
    #
    # Idempotency: `nmcli device disconnect/connect` is a no-op if
    # the device is already in the requested state. Both branches
    # are wrapped in `|| true` so a transient nmcli failure (e.g.
    # NM mid-restart) doesn't cascade — the next dispatcher event
    # gets another shot.
    #
    # Loop-prevention: the script filters on `en*` / `eth*` at the
    # top, so wifi-up events triggered by our own `device connect`
    # don't recurse. Loopback / virbr0 / tun device events also
    # short-circuit at that filter.
    #
    # The script lands at /etc/NetworkManager/dispatcher.d/ because
    # that path is hardcoded in NM's nm-dispatcher.service (see
    # `man NetworkManager-dispatcher`). NM only invokes scripts in
    # that directory that are owned by root with mode 0755 and no
    # group/other write — the explicit `chmod 0755` here is
    # mandatory or NM silently skips the script (the skip is logged
    # at debug level only, which is a confusing failure mode). The
    # `10-` prefix parallels the conf.d file above and reserves
    # room for higher-numbered dispatcher hooks the user might
    # layer on later (e.g. a VPN auto-reconnect hook).
    #
    # The check is `test -x` on the dispatcher path — if someone
    # wipes the file (or a Debian apt operation rewrites it) the
    # next forge run rewrites it; if it's already on disk and
    # executable, no-op.
    { run = "sudo mkdir -p /etc/NetworkManager/dispatcher.d && printf '#!/bin/bash\\n# Exclusive ethernet-preferred failover. Disconnects wifi when an\\n# ethernet device comes up; reconnects every wifi device when the last\\n# ethernet device goes down. See linux-config/config/roles.toml for\\n# the full design rationale (RFC 6724 source-address selection).\\ncase \"$1\" in en*|eth*) ;; *) exit 0 ;; esac\\ncase \"$2\" in\\n  up)\\n    for dev in $(nmcli -t -f DEVICE,TYPE device | grep \":wifi$\" | cut -d: -f1); do\\n      nmcli device disconnect \"$dev\" >/dev/null 2>&1 || true\\n    done\\n    ;;\\n  down)\\n    nmcli -t -f TYPE connection show --active | grep -q \"^802-3-ethernet$\" && exit 0\\n    for dev in $(nmcli -t -f DEVICE,TYPE device | grep \":wifi$\" | cut -d: -f1); do\\n      nmcli device connect \"$dev\" >/dev/null 2>&1 || true\\n    done\\n    ;;\\nesac\\n' | sudo tee /etc/NetworkManager/dispatcher.d/10-wifi-when-no-ethernet >/dev/null && sudo chmod 0755 /etc/NetworkManager/dispatcher.d/10-wifi-when-no-ethernet", check = "test -x /etc/NetworkManager/dispatcher.d/10-wifi-when-no-ethernet" },
    # bluetooth.service: the `bluez` package ships the unit but
    # Debian's postinst does not always enable it on a minimal
    # install (depends on debian-installer profile selection). Enable
    # explicitly so `bluetoothctl`, blueman, and PipeWire's BT bridge
    # all have a running daemon to talk to after the very first
    # `forge setup desktop` instead of needing a manual enable later.
    # The check uses `is-active` (not is-enabled) so a manually-stopped
    # daemon — e.g. during BT debugging — gets brought back up by the
    # next forge run, matching the NetworkManager pattern above.
    { run = "sudo systemctl enable --now bluetooth.service", check = "systemctl is-active --quiet bluetooth.service" },
    # power-profiles-daemon: enable + start. Debian's
    # power-profiles-daemon postinst usually starts the unit, but
    # the same defensive `enable --now` pattern as NetworkManager
    # / bluetooth applies — we want the daemon both up in this
    # session AND symlinked into multi-user.target so it returns
    # after a reboot. The `is-active` check (not `is-enabled`)
    # follows the established convention in this role: a
    # manually-stopped daemon gets brought back up by the next
    # forge run instead of being silently left down because the
    # symlink already exists. Without PPD running the
    # `powerprofilesctl` CLI errors with "No D-Bus name
    # net.hadess.PowerProfiles", which is a confusing failure mode
    # because the package is installed and the user's natural
    # next move is to assume the daemon name has changed.
    { run = "sudo systemctl enable --now power-profiles-daemon.service", check = "systemctl is-active --quiet power-profiles-daemon.service" },
    # systemd-logind lid-switch behavior. The defaults already match
    # what we want (suspend on lid close when undocked, ignore when
    # docked — i.e. when an external display is connected), but the
    # values in /etc/systemd/logind.conf ship commented-out, so a stray
    # admin edit could silently flip them. Pinning them via a drop-in
    # at /etc/systemd/logind.conf.d/sway-lid.conf locks the behavior in
    # and makes intent explicit; reload picks the new values up
    # without a logout.
    #
    # The combined effect:
    #   * lid close + no externals       → suspend (HandleLidSwitch)
    #   * lid close + externals plugged  → no-op  (HandleLidSwitchDocked)
    # That, paired with kanshi's `docked` profile turning eDP-1 off,
    # is what makes "close the laptop while docked, keep working on
    # the externals" feel right.
    { run = "sudo mkdir -p /etc/systemd/logind.conf.d && printf '[Login]\\nHandleLidSwitch=suspend\\nHandleLidSwitchExternalPower=suspend\\nHandleLidSwitchDocked=ignore\\n' | sudo tee /etc/systemd/logind.conf.d/sway-lid.conf >/dev/null && sudo systemctl reload systemd-logind", check = "test -f /etc/systemd/logind.conf.d/sway-lid.conf" },
    # System-scope flatpak operations (remote-add, install) need sudo.
    #
    # `flatpak` defaults to the *system* installation when invoked
    # without `--user`, which means writing under /var/lib/flatpak
    # (root-owned) and modifying the system-wide ostree repo + remote
    # config. The non-root path goes through polkit
    # (`org.freedesktop.Flatpak.app-install`,
    # `…manage-installation`); on a graphical session a polkit auth
    # agent prompts the user, but forge runs post-commands
    # non-interactively so polkit returns
    # `error: Flatpak system operation … not allowed for user` and
    # the executor aborts the whole plan.
    #
    # Wrapping with `sudo` short-circuits polkit (root is already
    # authorized) and the user's NOPASSWD sudoers entry means sudo
    # itself doesn't prompt either. Net effect: same observable
    # result — flathub remote + apps land at system scope, visible
    # to every user on the box, updateable only by the daily
    # flatpak-update systemd timer (also root-scoped, see below) —
    # with no interactive prompts in the install path.
    #
    # The two `--user` `flatpak override` lines below intentionally
    # do NOT take sudo, because `--user` writes to
    # ~/.local/share/flatpak/overrides and never touches system
    # state. Pinned by `desktop_role_system_flatpak_ops_use_sudo`.
    { run = "sudo flatpak remote-add --if-not-exists flathub https://flathub.org/repo/flathub.flatpakrepo", check = "flatpak remotes | grep -q '^flathub'" },
    { run = "sudo flatpak install -y --noninteractive flathub md.obsidian.Obsidian", check = "flatpak list --app | grep -q md.obsidian.Obsidian" },
    # Grant Wayland socket access to Electron flatpaks. Their default
    # manifests only ship x11 socket, which means they need Xwayland —
    # and Xwayland only runs if sway started AFTER the xwayland binary
    # was installed. Granting wayland directly + passing
    # --ozone-platform-hint=auto in the sway bind sidesteps the whole
    # Xwayland-startup ordering problem.
    #
    # Zen Browser used to live here too (flatpak install + wayland
    # override). It now ships as an upstream tarball — see the
    # `[[desktop.downloads]]` block named `zen-browser` above — because
    # the tarball runs noticeably faster on this stack (direct Wayland
    # path, no flatpak portal round-trips, no first-launch sandbox lag).
    { run = "flatpak override --user --socket=wayland md.obsidian.Obsidian", check = "flatpak override --user --show md.obsidian.Obsidian | grep -q 'sockets=.*wayland'" },
    # Daily flatpak-update systemd timer. The desktop role installs
    # both Zen Browser and Obsidian system-wide (flatpak's default
    # scope when the install command runs without --user / --system
    # is system, and the install lines above intentionally omit the
    # flag so the apps are visible to every user on the box). System
    # installs can only be updated by root, which means a per-user
    # cron / user-level systemd timer can't keep them current —
    # hence a system-level timer running `flatpak update` as root.
    #
    # The unit pair is written via `printf | sudo tee` rather than
    # shipped under dotfiles/ because the dotfiles tree is rooted at
    # $HOME and these are /etc/systemd/system/ paths (system-level
    # units, not user units). This matches the same pattern the
    # logind drop-in and the NM ethernet-priority drop-in use.
    #
    # Three details on the timer body itself:
    #   * `OnCalendar=daily` — fires once a day at midnight.
    #   * `RandomizedDelaySec=30m` — adds up to 30 minutes of jitter
    #     so a fleet of these laptops doesn't all hammer Flathub
    #     simultaneously at 00:00. (This box is one of one, but the
    #     setting costs nothing and matches systemd best practice.)
    #   * `Persistent=true` — if the laptop was suspended / powered
    #     off when the timer was scheduled to fire, run it once on
    #     the next boot instead of skipping the missed run.
    #
    # And on the service body:
    #   * `flatpak update -y --noninteractive` — `-y` answers yes to
    #     prompts; `--noninteractive` suppresses progress UI and
    #     downgrades any remaining prompt to "skip". Together they
    #     make the run safe to invoke from a unit with no tty.
    #   * `After=network-online.target` + `Wants=...` — flatpak
    #     update has to reach Flathub. Without ordering against
    #     network-online, a fast-booting laptop fires the service
    #     before WiFi associates and the update fails with a DNS
    #     error every boot when running with `Persistent=true`.
    #
    # Sandbox / hardening directives on the [Service] body. The unit
    # has to run as root because system-scope flatpak installs live
    # under /var/lib/flatpak (root-owned), but every privilege
    # beyond "read+write that one tree" is unnecessary and worth
    # taking away — defense in depth against a future flatpak (or
    # its deps') privilege-escalation bug. Each directive and the
    # specific blast-radius reduction it buys:
    #
    #   * `NoNewPrivileges=yes`   — exec-ed children can't gain new
    #     caps via setuid binaries. Flatpak's own `bwrap` use during
    #     update is the in-process variety that doesn't need
    #     setuid (root → root, no escalation), so this is safe and
    #     blocks any sneaky setuid path inside Flathub-shipped
    #     update hooks.
    #   * `PrivateTmp=yes`        — service gets its own private
    #     /tmp + /var/tmp. Stops a hypothetical tmpfile-race or
    #     symlink-attack against shared /tmp from leaking root.
    #   * `ProtectSystem=strict`  — entire filesystem is read-only
    #     except for /dev, /proc, /sys (handled separately) and the
    #     paths in `ReadWritePaths=`. So even if flatpak update were
    #     coerced into writing /etc/passwd or /usr/bin, the kernel
    #     refuses the syscall.
    #   * `ReadWritePaths=/var/lib/flatpak` — the one place the
    #     service legitimately writes (OSTree repo + deployments +
    #     exports). Pairs with ProtectSystem=strict.
    #   * `ProtectHome=read-only` — service can read /home (because
    #     a user might have a custom flatpak remote config under
    #     ~/.local/share/flatpak that flatpak's CLI consults via
    #     XDG_DATA_DIRS) but can't write any user file. System
    #     flatpak update has no business modifying $HOME at all.
    #   * `ProtectKernelTunables=yes` — read-only /proc/sys, /sys.
    #     Blocks `echo > /proc/sys/...` style escapes.
    #   * `ProtectKernelModules=yes` — denies module load/unload
    #     syscalls. flatpak update never legitimately loads a
    #     kernel module.
    #   * `ProtectControlGroups=yes` — read-only cgroup hierarchy.
    #     A compromised service can't reparent itself out of the
    #     unit's slice or escape resource limits.
    #   * `ProtectClock=yes`      — denies wall-clock changes and
    #     adjtimex. flatpak update has no clock-setting need.
    #   * `LockPersonality=yes`   — pins the personality(2) syscall
    #     to its current value. Stops a binary from switching to
    #     legacy x86 personality to evade syscall filters.
    #   * `RestrictRealtime=yes`  — blocks SCHED_FIFO/SCHED_RR.
    #     flatpak update doesn't need realtime priority; denying it
    #     removes one tool from a hypothetical exploit.
    #
    # I deliberately do NOT add `RestrictNamespaces=` — flatpak's
    # update path may call `bwrap` (which uses user / mount / pid
    # namespaces) for some triggers, and the breakage from
    # accidentally overconstraining that is harder to debug than
    # the surface area being defended is worth.
    #
    # Pinned by `desktop_role_hardens_flatpak_update_service` so a
    # future "I'll just simplify this" edit can't silently strip
    # any of these directives without the test catching it.
    #
    # The post-command writes both files in a single shell
    # invocation (using two `sudo tee` commands chained with `&&`),
    # then `daemon-reload`s and `enable --now`s the timer. The
    # check matches the timer file's existence — same `test -f`
    # pattern as the logind / NM drop-ins. Pinned by
    # `desktop_role_provisions_flatpak_update_timer`.
    { run = "sudo mkdir -p /etc/systemd/system && printf '[Unit]\\nDescription=Update system flatpak applications\\nAfter=network-online.target\\nWants=network-online.target\\n\\n[Service]\\nType=oneshot\\nExecStart=/usr/bin/flatpak update -y --noninteractive\\nNoNewPrivileges=yes\\nPrivateTmp=yes\\nProtectSystem=strict\\nReadWritePaths=/var/lib/flatpak\\nProtectHome=read-only\\nProtectKernelTunables=yes\\nProtectKernelModules=yes\\nProtectControlGroups=yes\\nProtectClock=yes\\nLockPersonality=yes\\nRestrictRealtime=yes\\n' | sudo tee /etc/systemd/system/flatpak-update.service >/dev/null && printf '[Unit]\\nDescription=Daily flatpak update\\n\\n[Timer]\\nOnCalendar=daily\\nRandomizedDelaySec=30m\\nPersistent=true\\n\\n[Install]\\nWantedBy=timers.target\\n' | sudo tee /etc/systemd/system/flatpak-update.timer >/dev/null && sudo systemctl daemon-reload && sudo systemctl enable --now flatpak-update.timer", check = "systemctl is-active --quiet flatpak-update.timer && systemctl is-enabled --quiet flatpak-update.timer" },
    # NOTE: the whisper.cpp clone + cmake build + symlink steps that
    # used to live here are gone. whisper-server and whisper-cli are
    # now vendored prebuilt under `dotfiles/.local/bin/` (statically
    # linked against libwhisper/libggml so the only runtime deps are
    # libopenblas + libgomp + libgfortran, all standard Debian
    # packages installed by the `server` role). The planner's ELF
    # detection writes them executable. To refresh them after a
    # whisper.cpp upstream release, see CLAUDE.md ("Refreshing the
    # vendored whisper-server binary").
    # Re-read user systemd units so the freshly-written
    # ~/.config/systemd/user/whisper-server.service is visible to
    # `systemctl --user start`. daemon-reload is a true no-op when the
    # unit hasn't changed, so we run it unconditionally; the `|| true`
    # swallows the harmless failure when forge runs outside a user
    # session (e.g. an SSH provision without -t).
    "systemctl --user daemon-reload 2>/dev/null || true",
    # Enable the pipewire-pulse user socket so PulseAudio-protocol
    # clients (browsers, media players, anything linking libpulse)
    # can find a server at $XDG_RUNTIME_DIR/pulse/native. Installing
    # `pipewire-pulse` (above, in packages) ships the .socket and
    # .service unit files but does NOT enable the socket — Debian's
    # postinst leaves that to the user, so without this command the
    # role looks correct (package present, PipeWire running) yet the
    # system stays silent for every libpulse caller. Native-PipeWire
    # callers like `pw-cat` and the dictate script's `pw-record`
    # work either way, which is what made this failure mode so
    # confusing the first time around.
    #
    # `enable --now` does both halves at once: symlinks the socket
    # into sockets.target.wants/ for next login, AND binds it in the
    # current session so audio comes back without a logout. The
    # socket is the right unit to enable (not the .service): it's
    # socket-activated, so the daemon stays asleep until the first
    # libpulse client connects, then starts on demand.
    #
    # The `2>/dev/null || true` covers the SSH-provision case where
    # there's no user systemd manager (same reasoning as the kanshi
    # enable below — `enable` would fail with "Failed to connect to
    # user scope bus" and we'd rather let setup complete than abort
    # on something that resolves itself the moment the user logs
    # into a graphical session).
    #
    # The check has two parts: `is-enabled` (the symlink under
    # sockets.target.wants/ exists, so it'll come up next login)
    # AND `is-active` (the socket is currently bound in this
    # session). Requiring both means a manually-stopped socket gets
    # brought back up by the next forge run — matching the
    # NetworkManager check above, which is `is-active` for the same
    # reason.
    { run = "systemctl --user enable --now pipewire-pulse.socket 2>/dev/null || true", check = "systemctl --user is-enabled --quiet pipewire-pulse.socket && systemctl --user is-active --quiet pipewire-pulse.socket" },
    # Enable the kanshi systemd user unit so it gets pulled in by
    # sway-session.target on every login. The unit's
    # `WantedBy=sway-session.target` only takes effect after a
    # user-side `systemctl enable`, which creates the symlink under
    # ~/.config/systemd/user/sway-session.target.wants/. The check
    # short-circuits reruns once the symlink is already in place.
    # The `2>/dev/null || true` covers the SSH-provision case where
    # there's no user systemd manager (e.g. a fresh box being
    # provisioned over SSH without -t); enable will fail with
    # "Failed to connect to user scope bus" and we'd rather let
    # setup complete than abort on something that resolves itself
    # the moment the user logs into sway.
    { run = "systemctl --user enable kanshi.service 2>/dev/null || true", check = "systemctl --user is-enabled --quiet kanshi.service" },
    # Bring kanshi under systemd management in the *currently
    # running* session, so the user doesn't have to log out / back
    # in to pick up the new ordering. Three things happen here:
    #
    #   1. Run `sway-session` to push WAYLAND_DISPLAY / SWAYSOCK /
    #      DISPLAY into the user-systemd manager's environment and
    #      activate sway-session.target. This is normally done by
    #      `exec $bin/sway-session` at login, but on the first
    #      deploy the user is already logged in and the manager
    #      env is missing those vars — without this step,
    #      kanshi.service would start with no wayland display and
    #      crash immediately. The script is idempotent (bails out
    #      with exit 0 if sway-session.target is already active),
    #      so reruns are cheap.
    #
    #   2. Kill any stray unmanaged kanshi left over from the old
    #      `exec_always $bin/kanshi-restart` autostart, or from a
    #      manual `kanshi &` earlier in the session. Without this,
    #      the systemd-managed kanshi from step 3 would race the
    #      surviving unmanaged one for the wlr-output-management
    #      subscription — exactly the multi-kanshi wedge the
    #      retired bash helper was working around.
    #
    #   3. Start kanshi.service. By now the user-systemd env has
    #      what kanshi needs and the unit's transitive
    #      WantedBy=sway-session.target makes this a normal start.
    #      We also clean up the per-session lockfile from the
    #      retired kanshi-restart helper so an eventual reboot
    #      starts from a clean slate.
    #
    # The `2>/dev/null || true` on the `start` covers the
    # SSH-provision case where there's no user systemd manager at
    # all — the start will fail with "Failed to connect to user
    # scope bus" and we'd rather let setup move on than abort on
    # something that resolves itself the moment the user logs into
    # a sway session.
    { run = "$HOME/.local/bin/sway-session 2>/dev/null || true; pkill -x kanshi 2>/dev/null; rm -f \"${XDG_RUNTIME_DIR:-/tmp}/kanshi-restart.lock\"; systemctl --user start kanshi.service 2>/dev/null || true", check = "systemctl --user is-active --quiet kanshi.service && pgrep -x kanshi >/dev/null" },
    # Remove the retired bash helpers from previous deploys. The
    # planner's WriteFile actions only write files we still ship —
    # files that have been deleted from the dotfiles tree linger
    # on disk forever unless we explicitly clean them up. These
    # two scripts (`kanshi-restart`, `kanshi-boot-kick`) were
    # superseded by the systemd unit + sway-session script and
    # would otherwise hang around as confusing orphans on PATH.
    # rm -f is idempotent (no error on already-gone), so reruns
    # are cheap and the check ensures we skip the rm entirely
    # once the cleanup has succeeded.
    { run = "rm -f $HOME/.local/bin/kanshi-restart $HOME/.local/bin/kanshi-boot-kick", check = "test ! -e $HOME/.local/bin/kanshi-restart && test ! -e $HOME/.local/bin/kanshi-boot-kick" },
]

[[desktop.downloads]]
name = "caskaydia-cove-nerd-font"
url = "https://github.com/ryanoasis/nerd-fonts/releases/latest/download/CascadiaCode.zip"
dest = "~/.local/share/fonts/CaskaydiaCove"
extract = "tree:0"

# Zen Browser tarball install. Replaces the previous flatpak install
# (`app.zen_browser.zen` from flathub) because the tarball runs noticeably
# better on this stack — direct GTK Wayland path with no flatpak portal
# round-trips, no Xwayland fallback, and no first-launch lag while flatpak
# stitches its sandbox.
#
# Upstream only ships `.tar.xz` for Linux (not .tar.gz / .zip), which is
# why `crates/common/src/executor.rs::tar_decompress_flag` learned the
# `.tar.xz` → `xJf` mapping. The tarball's top-level entry is `zen/`
# containing the launcher (`zen`), `firefox`/`zen-bin` and the supporting
# libs/assets — `extract = "tree:1"` strips that one level so contents
# land directly under `~/.local/zen/`. The `~/.local/bin/zen` wrapper
# (in dotfiles) is what `bindsym $mod+b exec zen` actually executes; it
# sets `MOZ_ENABLE_WAYLAND=1` (Gecko's equivalent of Chromium's
# `--ozone-platform-hint=auto`, the flag the old flatpak bindsym used)
# and execs `~/.local/zen/zen`.
[[desktop.downloads]]
name = "zen-browser"
url = "https://github.com/zen-browser/desktop/releases/latest/download/zen.linux-x86_64.tar.xz"
dest = "~/.local/zen"
extract = "tree:1"

# Whisper small.en Q5_1-quantized GGML model (~182 MiB). The `dictate`
# script POSTs WAV audio to whisper-server which keeps this model
# resident; the file only needs to exist once on disk, hence no
# `extract` field — the URL returns the raw .bin which is downloaded
# straight to `dest`.
#
# Model choice rationale on this i7-1185G7 (4c/8t Tiger Lake, no GPU):
# medium.en is roughly real-time on this CPU (~8 s of inference per
# 10 s clip), which feels sluggish vs. mobile dictation. small.en-q5_1
# is ~3-4x faster with a barely-detectable WER hit on dictation-style
# speech. Q5_1 also halves the resident RAM (~330 MiB instead of
# ~600 MiB) and is usually a touch faster than fp16 small.en on CPU
# because GEMM throughput is memory-bandwidth-bound here.
#
# To switch: replace the URL filename with e.g. `ggml-base.en.bin`
# (faster, lower quality) or `ggml-medium.en.bin` (slower, higher
# quality), update `dest` and the `--model` arg in
# .config/systemd/user/whisper-server.service to match, then rerun
# `forge setup desktop && dictate stop-server` so the next dictation
# press lazy-restarts the server with the new model.
[[desktop.downloads]]
name = "whisper-small-en-q5_1-model"
url = "https://huggingface.co/ggerganov/whisper.cpp/resolve/main/ggml-small.en-q5_1.bin"
dest = "~/.local/share/whisper.cpp/models/ggml-small.en-q5_1.bin"
