# Dev container configuration — one image, one container per project.
#
# # Mental model
#
# There is exactly one dev container image (built from `containerfile`
# below, tagged `image_tag`). Every `forge dev up <name>` creates a
# container from that image, named after the project. There are no
# language-specific presets — toolchains (rustup, nvm, pyenv, mise,
# uv, …) are installed *inside* the container the first time the
# project needs them, and they live in the `<name>-home` named volume
# mounted at `/home/dev`, so they persist across stop/start and across
# `forge dev rm`. This trades "rust pre-baked" for "every project gets
# the same shell, editor, and AI tools, then layers its own toolchain
# on top." Adding a preset back is a future option, not a current one.
#
# # Persistence model
#
# `containers/base.Containerfile` bakes the user's dotfiles (zsh, tmux,
# nvim, yazi, starship, theme) into `/home/dev` at build time, and the
# named volume `<name>-home` mounts on top of that path. Podman's
# first-run volume-seed behaviour copies the image's `/home/dev` into
# the volume the first time the volume is created, so a fresh
# `forge dev up myapp` starts with a fully-themed shell. Subsequent
# runs see the volume's own state — anything the user changes inside
# the container persists across stop/start AND across `forge dev rm`
# (the container goes; the volume survives). To re-seed an existing
# container's home from a rebuilt image, wipe the volume first:
# `podman volume rm <name>-home`.
#
# # Authentication
#
# SSH keys are NEVER mounted. The host's `$SSH_AUTH_SOCK` is forwarded
# at create time so `git push` over ssh works inside the container
# without the key material ever leaving the host's agent. Set
# `git config user.name` / `user.email` once inside — it lives in the
# home volume and persists.

# NOTE: there is no `containerfile` field. The Containerfile is
# embedded into the forge binary at compile time (see
# `containers/base.Containerfile` in this repo, exposed at runtime as
# `embed::BASE_CONTAINERFILE`) and materialised to a tempdir at
# `forge dev build` time alongside the embedded dotfiles tree. That
# tempdir is the build context podman sees, so `forge dev build`
# works from any cwd — you don't have to be in this repo. The binary
# alone is enough.

# Tag applied to the built image. Namespaced with `forge-` so a
# `podman images` listing makes it obvious which images come from
# this project, and so a generic name like `base` doesn't collide
# with random other images on the host.
image_tag = "forge-dev"

# Networking model: `--network=host`, baked in at `podman run` time
# in `crates/common/src/podman.rs::build_run_argv`. The container
# shares the host's network namespace, so anything it binds to
# `0.0.0.0:<port>` is automatically reachable on the host's LAN IP at
# the same port — no `-p` enumeration, no per-project port list. This
# is the only practical "reach the container from elsewhere" story
# for rootless podman: macvlan / bridge networking would give the
# container its own LAN identity but requires CAP_NET_ADMIN on the
# host namespace, which rootless deliberately doesn't have. Trade-
# offs: `localhost` inside the container means the host (so a port
# collision with a host service is a real collision), and the
# container has no network isolation from the host. True LAN-citizen
# workloads belong on `forge lxc` / `forge vm`, which DO get their
# own IPs. There is no toggle here on purpose — picking the model
# once and pinning it in tests (`run_argv_uses_host_network`) is
# simpler than carrying a config option no one flips.

# Forward the host's `$SSH_AUTH_SOCK` into the container at create
# time. The agent holds the keys; the container only gets a socket
# to request signatures, never the key material itself.
ssh_agent = true

# Volumes attached to every container. The single named volume below
# is what makes "start it and go back to work" actually work — see
# the persistence-model section above. The bind mounts after it pull
# the host's timezone into the container so timestamps inside match
# the host's wall-clock perception of "now" — see comment on the
# bind list itself.
[default_volumes]
named = [
    { name = "{name}-home", container = "/home/dev" },
]
# Read-only bind mounts of host system files. Currently TZ-only.
#
# Why this and not just `-e TZ=...`: glibc's time-formatting code
# reads `/etc/localtime` (the binary tzdata file describing the
# active zone) by default; the `TZ` env var is consulted only as
# a fallback. So `-e TZ=America/Los_Angeles` works in some tools
# but plenty of others (cron-style schedulers, anything linked to
# glibc's `tzset`) ignore it and fall back to UTC if
# `/etc/localtime` is the trixie-slim base image's UTC default.
# Bind-mounting the host's `/etc/localtime` (a symlink to the
# zone binary in `/usr/share/zoneinfo/`) gives glibc the right
# answer with zero per-container configuration. The Containerfile
# installs `tzdata` so the underlying zone files in
# `/usr/share/zoneinfo/` exist for the symlink target to resolve
# inside the container.
#
# We deliberately do NOT bind-mount `/etc/timezone`. That file is
# a Debian-specific human-readable zone name (e.g. `America/Los_Angeles`)
# that older Debian tooling consulted, but on modern systemd-based
# systems (including this trixie box) it doesn't exist — systemd's
# `timedatectl` and glibc's `tzset` both work off `/etc/localtime`
# alone. Trying to bind-mount a missing host file makes podman bail
# at container create with `statfs /etc/timezone: no such file or
# directory`, which is exactly the failure mode an earlier version
# of this config hit. If a future tool inside the container actually
# needs `/etc/timezone`, set the `TZ` env var instead — that's the
# cross-distro signal everyone respects.
#
# `readonly = true` is non-negotiable here: a misbehaving
# container under rootless podman + `--userns keep-id` maps its
# UID onto the host invoking-user UID, which on this single-user
# laptop is the user who actually owns `/etc/localtime`. Without
# `:ro`, a container could rewrite the host's clock zone. The
# field defaults to `false` on omitted entries (matching podman's
# default for plain `-v host:container`), so future entries that
# need rw stay terse.
bind = [
    { host = "/etc/localtime", container = "/etc/localtime", readonly = true },
]
