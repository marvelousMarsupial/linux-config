# Home row modifiers for the built-in laptop keyboard only. Tap for the letter,
# hold for the modifier: a and ; Super, s and l Alt, d and k Control, f and j Shift.
# Hold space for the symbol layer copied from the split board.
# 0001:0001 is the usual internal "AT Translated Set 2 keyboard"; check yours with
# `sudo keyd monitor`. Other keyboards, such as a split board, are left alone.
[ids]
0001:0001

[main]
# lettermod(modifier, key, idle ms, hold ms): a key pressed within the idle time
# of the last keypress stays a letter, so fast typing does not trigger modifiers.
a = lettermod(meta, a, 150, 200)
s = lettermod(alt, s, 150, 200)
d = lettermod(control, d, 150, 200)
f = lettermod(shift, f, 150, 200)
j = lettermod(shift, j, 150, 200)
k = lettermod(control, k, 150, 200)
l = lettermod(alt, l, 150, 200)
semicolon = lettermod(meta, semicolon, 150, 200)
# Space right after a letter stays a space, so pause briefly before a symbol.
space = lettermod(symbols, space, 150, 200)

# Openers on the left home row, closers mirrored on the right. Keys left out,
# such as x c v b, type their normal letter.
[symbols]
q = S-1
w = S-2
e = S-3
r = S-4
t = S-5
a = grave
s = S-comma
d = leftbrace
f = S-leftbrace
g = S-9
z = S-grave
y = S-6
u = S-7
i = S-8
o = minus
p = equal
h = S-0
j = S-rightbrace
k = rightbrace
l = S-dot
semicolon = S-semicolon
n = S-minus
m = S-equal
comma = S-backslash
dot = backslash
slash = semicolon
