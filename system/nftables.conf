#!/usr/sbin/nft -f
# Reload atomically replaces only this project's table.
add table inet linux_config
flush table inet linux_config

table inet linux_config {
    chain input {
        type filter hook input priority 10; policy drop;
        iifname "lo" counter accept
        ct state established,related counter accept
        ct state invalid counter drop
        # ICMP supports diagnostics, path MTU discovery and IPv6 addressing.
        meta l4proto { icmp, ipv6-icmp } counter accept
        # DHCP replies, including initial address acquisition.
        udp sport 67 udp dport 68 counter accept
        ip6 saddr fe80::/10 udp sport 547 udp dport 546 counter accept
        # DNS/DHCP services for libvirt's private guest bridges only.
        iifname "virbr*" udp dport { 53, 67 } counter accept
        iifname "virbr*" tcp dport 53 counter accept
        # T3 Code: allow paired clients on the trusted 10.160.110.0/24 network.
        ip saddr 10.160.110.0/24 tcp dport 3773 counter accept
        counter drop comment "Unsolicited incoming traffic"
    }
    # Outgoing traffic and guest forwarding retain existing policy.
}
