---
# Teardown remote-desktop role (removes ONLY remote-desktop-specific additions)

- name: Stop Sunshine if running
  ansible.builtin.shell: pkill -f sunshine 2>/dev/null || true
  become: false
  ignore_errors: true

- name: Stop PulseAudio if running
  ansible.builtin.shell: pulseaudio --kill 2>/dev/null || true
  become: false
  ignore_errors: true

- name: Remove Sunshine config
  ansible.builtin.file:
    path: "{{ target_home }}/.config/sunshine"
    state: absent
  become: false

- name: Remove headless Sway config
  ansible.builtin.file:
    path: "{{ target_home }}/.config/sway/headless"
    state: absent
  become: false

- name: Remove remote desktop aliases block
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.zsh_aliases"
    marker: "# {mark} REMOTE DESKTOP ALIASES"
    state: absent
  become: false
  ignore_errors: true

- name: Remove WireGuard firewall rule
  community.general.ufw:
    rule: allow
    port: "51820"
    proto: udp
    delete: true
  ignore_errors: true

# Note: Sunshine flatpak left installed (flatpak uninstall to fully remove)
# Note: WireGuard, PulseAudio packages left installed
# Note: ufw left enabled with SSH allowed
# Note: WireGuard config in /etc/wireguard left intact
