---
# Teardown remote-desktop role (removes ONLY remote-desktop-specific additions)

- name: Stop VNC if running
  ansible.builtin.shell: vncserver -kill :1 2>/dev/null || true
  become: false
  ignore_errors: true

- name: Remove VNC config
  ansible.builtin.file:
    path: "{{ target_home }}/.vnc"
    state: absent
  become: false

- name: Remove VNC scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.local/bin/vnc-start"
    - "{{ target_home }}/.local/bin/vnc-stop"
  become: false

- name: Remove VNC aliases block
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.zsh_aliases"
    marker: "# {mark} VNC ALIASES"
    state: absent
  become: false
  ignore_errors: true
