---
- name: Install VNC packages
  ansible.builtin.apt:
    name:
      - tigervnc-standalone-server
      - tigervnc-common
    state: present

- name: Create VNC directory
  ansible.builtin.file:
    path: "{{ target_home }}/.vnc"
    state: directory
  become: false

- name: Create VNC xstartup
  ansible.builtin.copy:
    dest: "{{ target_home }}/.vnc/xstartup"
    mode: "0755"
    content: |
      #!/bin/bash
      exec sway
  become: false

- name: Create VNC config
  ansible.builtin.copy:
    dest: "{{ target_home }}/.vnc/config"
    content: |
      geometry=1920x1080
      depth=24
  become: false

- name: Create vnc-start script
  ansible.builtin.copy:
    dest: "{{ target_home }}/.local/bin/vnc-start"
    mode: "0755"
    content: |
      #!/bin/bash
      vncserver :1 -localhost yes
      echo "VNC running on localhost:5901"
      echo "Tunnel: ssh -L 5901:localhost:5901 $(whoami)@$(hostname -I | awk '{print $1}')"
      echo "Then connect VNC client to: localhost:5901"
  become: false

- name: Create vnc-stop script
  ansible.builtin.copy:
    dest: "{{ target_home }}/.local/bin/vnc-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      vncserver -kill :1
  become: false

- name: Add VNC aliases
  ansible.builtin.blockinfile:
    path: "{{ target_home }}/.zsh_aliases"
    marker: "# {mark} VNC ALIASES"
    block: |
      alias vstart='vnc-start'
      alias vstop='vnc-stop'
  become: false
