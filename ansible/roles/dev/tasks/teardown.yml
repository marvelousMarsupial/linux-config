---
# Teardown dev role (removes ONLY dev-specific additions)

- name: Stop dev services
  ansible.builtin.shell: |
    pkill -f code-server || true
    pkill -f jupyter-lab || true
  become: false
  ignore_errors: true

- name: Remove dev scripts
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.local/bin/coder-start"
    - "{{ ansible_env.HOME }}/.local/bin/coder-stop"
    - "{{ ansible_env.HOME }}/.local/bin/jupyter-start"
    - "{{ ansible_env.HOME }}/.local/bin/jupyter-stop"
  become: false

- name: Remove jupyter venv
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.venv/jupyter"
    state: absent
  become: false

- name: Remove dev aliases block
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zsh_aliases"
    marker: "# {mark} DEV ALIASES"
    state: absent
  become: false
  ignore_errors: true
