---
- name: Get latest code-server release
  ansible.builtin.uri:
    url: https://api.github.com/repos/coder/code-server/releases/latest
    return_content: true
  register: codeserver_release

- name: Install code-server
  ansible.builtin.apt:
    deb: >-
      https://github.com/coder/code-server/releases/download/{{
      codeserver_release.json.tag_name }}/code-server_{{
      codeserver_release.json.tag_name | regex_replace('^v', '') }}_amd64.deb
  when: ansible_architecture == "x86_64"

- name: Get latest lazygit release
  ansible.builtin.uri:
    url: https://api.github.com/repos/jesseduffield/lazygit/releases/latest
    return_content: true
  register: lazygit_release

- name: Download lazygit
  ansible.builtin.unarchive:
    src: >-
      https://github.com/jesseduffield/lazygit/releases/download/{{
      lazygit_release.json.tag_name }}/lazygit_{{
      lazygit_release.json.tag_name | regex_replace('^v', '')
      }}_Linux_x86_64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - lazygit
  when: ansible_architecture == "x86_64"

- name: Install GitHub CLI
  ansible.builtin.shell: |
    curl -fsSL https://cli.github.com/packages/githubcli-archive-keyring.gpg \
      | dd of=/usr/share/keyrings/githubcli-archive-keyring.gpg
    chmod go+r /usr/share/keyrings/githubcli-archive-keyring.gpg
    echo "deb [arch=$(dpkg --print-architecture) \
      signed-by=/usr/share/keyrings/githubcli-archive-keyring.gpg] \
      https://cli.github.com/packages stable main" \
      | tee /etc/apt/sources.list.d/github-cli.list > /dev/null
    apt update && apt install -y gh
  args:
    creates: /usr/bin/gh

- name: Get latest tea (Gitea CLI) release
  ansible.builtin.uri:
    url: https://api.github.com/repos/go-gitea/tea/releases/latest
    return_content: true
  register: tea_release

- name: Download tea
  ansible.builtin.unarchive:
    src: >-
      https://github.com/go-gitea/tea/releases/download/{{
      tea_release.json.tag_name }}/tea-{{
      tea_release.json.tag_name | regex_replace('^v', '')
      }}-linux-amd64.tar.gz
    dest: /usr/local/bin
    remote_src: true
    include:
      - tea
  when: ansible_architecture == "x86_64"
