---
- name: Create service scripts directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
  become: false

- name: Create coder-start script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/coder-start"
    mode: "0755"
    content: |
      #!/bin/bash

      # Help
      if [[ "$1" == "-h" || "$1" == "--help" ]]; then
        echo "Usage: coder"
        echo ""
        echo "Starts code-server on localhost."
        echo ""
        echo "Steps:"
        echo "  1. From laptop: ssh -L 8000:localhost:8000 user@server"
        echo "  2. On server:   coder"
        echo "  3. In browser:  http://localhost:8000"
        exit 0
      fi

      # Already running?
      if pgrep -f code-server > /dev/null; then
        echo "code-server already running"
        echo ""
        PID=$(pgrep -f code-server)
        PORT=$(ss -tlnp | grep $PID | grep -oP ':\K[0-9]+' | head -1)
        IP=$(hostname -I | awk '{print $1}')
        echo "From your laptop:"
        echo "  ssh -L $PORT:localhost:$PORT $(whoami)@$IP"
        echo "  open http://localhost:$PORT"
        exit 0
      fi

      # Find open port
      PORT=8000
      while ss -tln | grep -q ":$PORT "; do
        ((PORT++))
      done

      # Start code-server
      code-server --bind-addr 127.0.0.1:$PORT --auth none > /tmp/coder.log 2>&1 &
      sleep 1

      # Check if it started
      if ! ss -tln | grep -q ":$PORT "; then
        echo "Failed to start code-server"
        echo ""
        cat /tmp/coder.log
        exit 1
      fi

      # Success
      IP=$(hostname -I | awk '{print $1}')
      echo "code-server :$PORT"
      echo ""
      echo "From your laptop:"
      echo "  ssh -L $PORT:localhost:$PORT $(whoami)@$IP"
      echo "  open http://localhost:$PORT"
  become: false

- name: Create coder-stop script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/coder-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      pkill -f code-server && echo "code-server stopped" || echo "code-server not running"
  become: false

- name: Create jupyter-start script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/jupyter-start"
    mode: "0755"
    content: |
      #!/bin/bash

      # Help
      if [[ "$1" == "-h" || "$1" == "--help" ]]; then
        echo "Usage: jupyter"
        echo ""
        echo "Starts JupyterLab on localhost."
        echo ""
        echo "Steps:"
        echo "  1. From laptop: ssh -L 9000:localhost:9000 user@server"
        echo "  2. On server:   jupyter"
        echo "  3. In browser:  http://localhost:9000"
        exit 0
      fi

      # Already running?
      if pgrep -f jupyter-lab > /dev/null; then
        echo "jupyter already running"
        echo ""
        PID=$(pgrep -f jupyter-lab)
        PORT=$(ss -tlnp | grep $PID | grep -oP ':\K[0-9]+' | head -1)
        IP=$(hostname -I | awk '{print $1}')
        echo "From your laptop:"
        echo "  ssh -L $PORT:localhost:$PORT $(whoami)@$IP"
        echo "  open http://localhost:$PORT"
        exit 0
      fi

      # Find open port
      PORT=9000
      while ss -tln | grep -q ":$PORT "; do
        ((PORT++))
      done

      # Start jupyter
      source ~/.venv/jupyter/bin/activate
      jupyter lab --ip=127.0.0.1 --port=$PORT --no-browser --allow-root --IdentityProvider.token='' > /tmp/jupyter.log 2>&1 &
      sleep 2

      # Check if it started
      if ! ss -tln | grep -q ":$PORT "; then
        echo "Failed to start jupyter"
        echo ""
        cat /tmp/jupyter.log
        exit 1
      fi

      # Success
      IP=$(hostname -I | awk '{print $1}')
      echo "jupyter :$PORT"
      echo ""
      echo "From your laptop:"
      echo "  ssh -L $PORT:localhost:$PORT $(whoami)@$IP"
      echo "  open http://localhost:$PORT"
  become: false

- name: Create jupyter-stop script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/jupyter-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      pkill -f jupyter-lab && echo "jupyter-lab stopped" || echo "jupyter-lab not running"
  become: false

- name: Add dev aliases
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zsh_aliases"
    marker: "# {mark} DEV ALIASES"
    block: |
      alias coder='coder-start'
      alias coder-stop='pkill -f code-server && echo "stopped" || echo "not running"'
      alias jupyter='jupyter-start'
      alias jupyter-stop='pkill -f jupyter-lab && echo "stopped" || echo "not running"'
      alias lg='lazygit'
  become: false
