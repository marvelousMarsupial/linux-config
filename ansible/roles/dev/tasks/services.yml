---
- name: Create service scripts directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
  become: false

- name: Create coder-start script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/coder-start"
    mode: "0755"
    content: |
      #!/bin/bash
      if pgrep -f code-server > /dev/null; then
        echo "code-server already running"
        exit 1
      fi
      code-server --bind-addr 127.0.0.1:8080 --auth none > /dev/null 2>&1 &
      sleep 1
      IP=$(hostname -I | awk '{print $1}')
      echo "code-server running"
      echo ""
      echo "From your laptop:"
      echo "  ssh -L 8080:localhost:8080 $(whoami)@$IP"
      echo "  open http://localhost:8080"
  become: false

- name: Create coder-stop script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/coder-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      pkill -f code-server && echo "code-server stopped" || echo "code-server not running"
  become: false

- name: Create jupyter-start script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/jupyter-start"
    mode: "0755"
    content: |
      #!/bin/bash
      if pgrep -f jupyter-lab > /dev/null; then
        echo "jupyter-lab already running"
        exit 1
      fi
      source ~/.venv/jupyter/bin/activate
      jupyter lab --ip=127.0.0.1 --port=8888 --no-browser --IdentityProvider.token='' > /dev/null 2>&1 &
      sleep 2
      IP=$(hostname -I | awk '{print $1}')
      echo "jupyter running"
      echo ""
      echo "From your laptop:"
      echo "  ssh -L 8888:localhost:8888 $(whoami)@$IP"
      echo "  open http://localhost:8888"
  become: false

- name: Create jupyter-stop script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/jupyter-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      pkill -f jupyter-lab && echo "jupyter-lab stopped" || echo "jupyter-lab not running"
  become: false

- name: Add dev aliases
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zsh_aliases"
    marker: "# {mark} DEV ALIASES"
    block: |
      alias coder='coder-start'
      alias coder-stop='pkill -f code-server && echo "stopped" || echo "not running"'
      alias jupyter='jupyter-start'
      alias jupyter-stop='pkill -f jupyter-lab && echo "stopped" || echo "not running"'
      alias lg='lazygit'
  become: false
