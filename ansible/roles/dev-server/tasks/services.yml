---
- name: Create service scripts directory
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.local/bin"
    state: directory
  become: false

- name: Create coder-start script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/coder-start"
    mode: "0755"
    content: |
      #!/bin/bash
      if pgrep -f code-server > /dev/null; then
        echo "code-server already running"
        exit 1
      fi

      code-server --bind-addr 127.0.0.1:8080 --auth none > /dev/null 2>&1 &
      sleep 1
      echo "code-server running at http://$(hostname -I | awk '{print $1}')/code"
  become: false

- name: Create coder-stop script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/coder-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      pkill -f code-server && echo "code-server stopped" || echo "code-server not running"
  become: false

- name: Create jupyter-start script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/jupyter-start"
    mode: "0755"
    content: |
      #!/bin/bash
      if pgrep -f jupyter-lab > /dev/null; then
        echo "jupyter-lab already running"
        exit 1
      fi

      source ~/.venv/jupyter/bin/activate
      jupyter lab --ip=127.0.0.1 --port=8888 --no-browser --IdentityProvider.token='' > /dev/null 2>&1 &
      sleep 2
      echo "JupyterLab running at http://$(hostname -I | awk '{print $1}')/jupyter"
  become: false

- name: Create jupyter-stop script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/jupyter-stop"
    mode: "0755"
    content: |
      #!/bin/bash
      pkill -f jupyter-lab && echo "jupyter-lab stopped" || echo "jupyter-lab not running"
  become: false

- name: Create dev-open script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/dev-open"
    mode: "0755"
    content: |
      #!/bin/bash
      PORT="${1:-3000}"
      KEY=$(grep -oP 'handle_path /\K[a-z0-9]+(?=/code)' /etc/caddy/Caddyfile)
      if grep -q "# DEV-EXPOSE" /etc/caddy/Caddyfile; then
        echo "Already exposing a port. Run 'dev-close' first."
        exit 1
      fi
      sudo sed -i '/^}$/i\
        # DEV-EXPOSE\
        handle_path /'"$KEY"'/dev/* {\
          reverse_proxy 127.0.0.1:'"$PORT"'\
        }' /etc/caddy/Caddyfile
      sudo systemctl reload caddy
      echo "Exposed localhost:$PORT at http://$(hostname -I | awk '{print $1}')/$KEY/dev"
  become: false

- name: Create dev-close script
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.local/bin/dev-close"
    mode: "0755"
    content: |
      #!/bin/bash
      sudo sed -i '/# DEV-EXPOSE/,/}/d' /etc/caddy/Caddyfile
      sudo systemctl reload caddy
      echo "Dev port closed"
  become: false

- name: Add dev-server aliases
  ansible.builtin.blockinfile:
    path: "{{ ansible_env.HOME }}/.zsh_aliases"
    marker: "# {mark} DEV-SERVER ALIASES"
    block: |
      alias cstart='coder-start'
      alias cstop='coder-stop'
      alias jstart='jupyter-start'
      alias jstop='jupyter-stop'
      alias lg='lazygit'
  become: false
