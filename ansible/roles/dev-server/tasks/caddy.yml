---
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Generate secret key
  ansible.builtin.set_fact:
    dev_key: "{{ lookup('password', '/dev/null length=24 chars=ascii_lowercase,digits') }}"

- name: Create Caddyfile
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    content: |
      :80 {
        handle_path /{{ dev_key }}/code/* {
          reverse_proxy 127.0.0.1:8080
        }

        handle_path /{{ dev_key }}/jupyter/* {
          reverse_proxy 127.0.0.1:8888
        }

        handle_path /{{ dev_key }}/* {
          respond "code | jupyter"
        }

        handle /* {
          respond "Not found" 404
        }
      }

- name: Save access URLs
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.dev-urls"
    mode: "0600"
    content: |
      code:    http://{{ ansible_default_ipv4.address }}/{{ dev_key }}/code
      jupyter: http://{{ ansible_default_ipv4.address }}/{{ dev_key }}/jupyter
  become: false

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: restarted

- name: Show access URLs
  ansible.builtin.debug:
    msg: "Bookmark these URLs (saved to ~/.dev-urls)"
