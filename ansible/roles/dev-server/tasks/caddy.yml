---
- name: Install Caddy
  ansible.builtin.apt:
    name: caddy
    state: present

- name: Generate dev-server password
  ansible.builtin.set_fact:
    dev_password: "{{ lookup('password', '/dev/null length=16 chars=ascii_letters,digits') }}"

- name: Hash password for Caddy
  ansible.builtin.command:
    cmd: caddy hash-password --plaintext "{{ dev_password }}"
  register: password_hash
  changed_when: false

- name: Create Caddyfile
  ansible.builtin.copy:
    dest: /etc/caddy/Caddyfile
    content: |
      :80 {
        basicauth /* {
          dev {{ password_hash.stdout }}
        }

        handle_path /code/* {
          reverse_proxy 127.0.0.1:8080
        }

        handle_path /jupyter/* {
          reverse_proxy 127.0.0.1:8888
        }

        handle / {
          respond "dev-server: /code /jupyter"
        }
      }

- name: Save password to file
  ansible.builtin.copy:
    dest: "{{ ansible_env.HOME }}/.dev-password"
    mode: "0600"
    content: |
      dev-server login
      user: dev
      pass: {{ dev_password }}
  become: false

- name: Enable and start Caddy
  ansible.builtin.systemd:
    name: caddy
    enabled: true
    state: restarted

- name: Show login info
  ansible.builtin.debug:
    msg: "dev-server login - user: dev, pass: {{ dev_password }} (saved to ~/.dev-password)"
