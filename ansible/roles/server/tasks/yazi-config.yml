---
- name: Create yazi config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ ansible_env.HOME }}/.config/yazi"
    - "{{ ansible_env.HOME }}/.config/yazi/flavors"

- name: Clone yazi catppuccin-mocha flavor
  ansible.builtin.git:
    repo: https://github.com/yazi-rs/flavors.git
    dest: /tmp/yazi-flavors
    update: true

- name: Copy catppuccin-mocha flavor
  ansible.builtin.copy:
    src: /tmp/yazi-flavors/catppuccin-mocha.yazi/
    dest: "{{ ansible_env.HOME }}/.config/yazi/flavors/catppuccin-mocha.yazi/"
    remote_src: true

- name: Clone yazi gruvbox flavor
  ansible.builtin.git:
    repo: https://github.com/bennyyip/gruvbox-dark.yazi.git
    dest: "{{ ansible_env.HOME }}/.config/yazi/flavors/gruvbox-dark.yazi"
    update: true
