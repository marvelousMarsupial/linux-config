---
- name: Download Yazi
  ansible.builtin.get_url:
    url: >-
      https://github.com/sxyazi/yazi/releases/latest/download/yazi-{{ arch_rust }}.zip
    dest: /tmp/yazi.zip

- name: Extract and install Yazi + ya CLI
  ansible.builtin.shell: |
    unzip -o /tmp/yazi.zip -d /tmp/yazi
    mv /tmp/yazi/yazi-{{ arch_rust }}/yazi /usr/local/bin/
    mv /tmp/yazi/yazi-{{ arch_rust }}/ya /usr/local/bin/
    chmod +x /usr/local/bin/yazi /usr/local/bin/ya
  args:
    creates: /usr/local/bin/yazi
