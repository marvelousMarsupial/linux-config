---
- name: Install base packages
  ansible.builtin.apt:
    name:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - tmux
      - git
      - curl
      - wget
      - stow
      - unzip
      - btop
      - bat
      - eza
      - fd-find
      - ripgrep
      - trash-cli
      - python3-yaml
      - python3-jinja2
    state: present
    update_cache: true
