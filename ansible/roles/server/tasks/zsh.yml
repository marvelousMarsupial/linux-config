---
- name: Set zsh as default shell
  ansible.builtin.user:
    name: root
    shell: /bin/zsh

- name: Create trash directory
  ansible.builtin.file:
    path: ~/.trash
    state: directory

- name: Create .zshrc
  ansible.builtin.copy:
    dest: ~/.zshrc
    content: |
      # Plugins
      source /usr/share/zsh-autosuggestions/zsh-autosuggestions.zsh
      source /usr/share/zsh-syntax-highlighting/zsh-syntax-highlighting.zsh
      
      # Starship prompt
      eval "$(starship init zsh)"
      
      # History
      HISTFILE=~/.zsh_history
      HISTSIZE=10000
      SAVEHIST=10000
      setopt appendhistory
      
      # Navigation
      alias ..='cd ..'
      alias ...='cd ../..'
      alias c='clear'
      alias x='exit'
      
      # Safety
      alias cp='cp -iv'
      alias mv='mv -iv'
      alias rm='mv -t ~/.trash'
      
      # Listing
      alias l='ls -lah'
      alias lt='ls -lahtr'
      alias ls='eza'
      alias cat='bat'
      
      # System Info
      alias ip='ip -br -c'
      alias ports='ss -tulanp'
      alias df='df -h'
      alias free='free -h'
      alias dmesg='dmesg -T'
      
      # Process/Resource
      alias topmem='ps aux --sort=-%mem | head'
      alias topcpu='ps aux --sort=-%cpu | head'
      alias psg='ps aux | grep'
      
      # Disk Usage
      alias du='du -h'
      alias dud='du -d 1 -h'
      alias duf='du -sh *'
      
      # Network
      alias myip='curl -s ifconfig.me'
      alias ping='ping -c 5'
      alias wgup='sudo wg-quick up wg0'
      alias wgdown='sudo wg-quick down wg0'
      
      # Quick Tools
      alias v='nvim'
      alias y='yazi'
      alias t='date +%H:%M'
      alias weather='curl wttr.in'
      alias serve='python3 -m http.server'
      alias please='sudo $(fc -ln -1)'
      alias ag='alias | grep'
      
      # Archives
      alias untar='tar -xvf'
      alias targz='tar -czvf'
      
      # Finding
      alias findd='find . -type d -name'
      alias findf='find . -type f -name'
      
      # Global Aliases
      alias -g G='| grep'
      alias -g L='| less'
      alias -g H='| head'
      alias -g T='| tail'
      alias -g W='| wc -l'
      alias -g S='| sort'
      alias -g U='| sort -u'
