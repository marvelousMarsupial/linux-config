---
# Teardown server role - return to basic state

- name: Unstow all packages
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    for pkg in */; do
      stow -D "$pkg" 2>/dev/null || true
    done
  args:
    executable: /bin/bash

- name: Remove generated configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.config/nvim/lua/plugins/colorscheme.lua"
    - "{{ target_home }}/.config/yazi/theme.toml"
    - "{{ target_home }}/.tmux.conf"
    - "{{ target_home }}/.zshrc"
    - "{{ target_home }}/.zsh_aliases"
    - "{{ target_home }}/.config/starship.toml"

- name: Remove config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.config/yazi"
    - "{{ target_home }}/.config/nvim"
    - "{{ target_home }}/.config/theme"
    - "{{ target_home }}/.cache/theme"
    - "{{ target_home }}/.cache/forge"
    - "{{ target_home }}/.local/nvim-runtime"

- name: Reset shell to bash
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /bin/bash
  become: true

# Full teardown - remove installed packages
- name: Disable firewall (full teardown)
  community.general.ufw:
    state: disabled
  become: true
  when: full_teardown | default(false) | bool

- name: Remove installed packages (full teardown)
  ansible.builtin.apt:
    name:
      - zsh
      - zsh-autosuggestions
      - zsh-syntax-highlighting
      - tmux
      - stow
      - fzf
      - ripgrep
      - fd-find
      - jq
      - python3-pip
      - python3-jinja2
      - python3-yaml
      - ufw
      - fail2ban
    state: absent
    autoremove: true
  become: true
  when: full_teardown | default(false) | bool

- name: Remove neovim (full teardown)
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.local/bin/nvim"
    - "{{ target_home }}/.local/nvim-runtime"
  when: full_teardown | default(false) | bool

- name: Remove yazi (full teardown)
  ansible.builtin.file:
    path: "{{ target_home }}/.local/bin/yazi"
    state: absent
  when: full_teardown | default(false) | bool

- name: Remove starship (full teardown)
  ansible.builtin.file:
    path: "{{ target_home }}/.local/bin/starship"
    state: absent
  when: full_teardown | default(false) | bool

- name: Remove theme script (full teardown)
  ansible.builtin.file:
    path: "{{ target_home }}/.local/bin/theme"
    state: absent
  when: full_teardown | default(false) | bool
