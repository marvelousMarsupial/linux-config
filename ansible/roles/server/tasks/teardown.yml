---
# Teardown server role - return to basic state

- name: Unstow all packages
  ansible.builtin.shell: |
    cd {{ ansible_env.HOME }}/linux-config/stow
    for pkg in */; do
      stow -D "$pkg" 2>/dev/null || true
    done
  args:
    executable: /bin/bash

- name: Remove generated configs
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.config/nvim/lua/plugins/colorscheme.lua"
    - "{{ ansible_env.HOME }}/.config/yazi/theme.toml"
    - "{{ ansible_env.HOME }}/.tmux.conf"
    - "{{ ansible_env.HOME }}/.zshrc"
    - "{{ ansible_env.HOME }}/.zsh_aliases"
    - "{{ ansible_env.HOME }}/.config/starship.toml"

- name: Remove cache directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.cache/theme"
    - "{{ ansible_env.HOME }}/.cache/forge"

- name: Reset shell to bash
  ansible.builtin.user:
    name: "{{ ansible_env.USER }}"
    shell: /bin/bash
  become: true
