---
# Teardown server role

- name: Remove stow symlinks
  ansible.builtin.shell: |
    cd {{ ansible_env.HOME }}/linux-config/stow
    stow -D -t {{ ansible_env.HOME }} zsh tmux yazi theme 2>/dev/null || true
  become: false
  ignore_errors: true

- name: Remove nvim config
  ansible.builtin.file:
    path: "{{ ansible_env.HOME }}/.config/nvim"
    state: absent
  become: false

- name: Remove generated theme files
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.tmux.conf"
    - "{{ ansible_env.HOME }}/.config/yazi/theme.toml"
    - "{{ ansible_env.HOME }}/.config/gtk-3.0/gtk.css"
    - "{{ ansible_env.HOME }}/.config/gtk-4.0/gtk.css"
  become: false

- name: Remove cache
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ ansible_env.HOME }}/.cache/theme"
    - "{{ ansible_env.HOME }}/.cache/forge"
  become: false

- name: Reset shell to bash
  ansible.builtin.user:
    name: "{{ ansible_user_id }}"
    shell: /bin/bash

- name: Note about packages
  ansible.builtin.debug:
    msg: "Packages not removed. Run 'sudo apt autoremove' manually if needed."
