---
- name: Install theme dependencies
  ansible.builtin.apt:
    name:
      - python3-yaml
      - python3-jinja2
    state: present

- name: Remove stow conflicts for theme
  ansible.builtin.shell: |
    [ -e "{{ item }}" ] && [ ! -L "{{ item }}" ] && rm -rf "{{ item }}" || true
  loop:
    - "{{ target_home }}/.local/bin/theme"
    - "{{ target_home }}/.config/theme"
  changed_when: false
  become: false

- name: Stow theme configuration
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    stow -t {{ target_home }} theme
  args:
    creates: "{{ target_home }}/.config/theme/config.toml"
  become: false

- name: Create app config directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - "{{ target_home }}/.config/foot"
    - "{{ target_home }}/.config/sway"
    - "{{ target_home }}/.config/mako"
    - "{{ target_home }}/.config/fuzzel"
    - "{{ target_home }}/.config/yazi"
    - "{{ target_home }}/.config/nvim/lua/plugins"
    - "{{ target_home }}/.cache/theme"
  become: false

- name: Apply default theme
  ansible.builtin.command:
    cmd: "{{ target_home }}/.local/bin/theme apply {{ default_theme }}"
  changed_when: true
  become: false
