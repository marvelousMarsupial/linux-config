---
- name: Remove existing nvim config
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.config/nvim"
    - "{{ target_home }}/.local/share/nvim"
    - "{{ target_home }}/.local/state/nvim"
    - "{{ target_home }}/.cache/nvim"
  become: false

- name: Clone LazyVim starter
  ansible.builtin.git:
    repo: https://github.com/LazyVim/starter
    dest: "{{ target_home }}/.config/nvim"
  become: false

- name: Remove LazyVim .git folder
  ansible.builtin.file:
    path: "{{ target_home }}/.config/nvim/.git"
    state: absent
  become: false
