---
- name: Create trash directory
  ansible.builtin.file:
    path: "{{ target_home }}/.trash"
    state: directory
  become: false

- name: Set zsh as default shell
  ansible.builtin.user:
    name: "{{ target_user }}"
    shell: /bin/zsh

- name: Remove existing dotfiles
  ansible.builtin.file:
    path: "{{ item }}"
    state: absent
  loop:
    - "{{ target_home }}/.zshrc"
    - "{{ target_home }}/.zsh_aliases"
    - "{{ target_home }}/.tmux.conf"
    - "{{ target_home }}/.config/yazi"
  become: false

- name: Stow dotfiles
  ansible.builtin.shell: |
    cd {{ target_home }}/linux-config/stow
    stow -t {{ target_home }} zsh tmux yazi
  become: false

- name: Copy nvim customizations
  ansible.builtin.copy:
    src: "{{ target_home }}/linux-config/stow/nvim/.config/nvim/lua/"
    dest: "{{ target_home }}/.config/nvim/lua/"
    remote_src: true
  become: false

- name: Copy nvim lazyvim.json (enables extras)
  ansible.builtin.copy:
    src: "{{ target_home }}/linux-config/stow/nvim/.config/nvim/lazyvim.json"
    dest: "{{ target_home }}/.config/nvim/lazyvim.json"
    remote_src: true
  become: false
