---
- name: Check if Flavours exists
  ansible.builtin.stat:
    path: /usr/local/bin/flavours
  register: flavours_check

- name: Note about Flavours
  ansible.builtin.debug:
    msg: "Flavours not auto-installed - install manually or fix Gitea access"
  when: not flavours_check.stat.exists

- name: Create flavours directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
  loop:
    - ~/.local/share/flavours/base16/schemes
    - ~/.local/share/flavours/base16/templates
    - ~/.config/flavours

- name: Clone theme schemes
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "~/.local/share/flavours/base16/schemes/{{ item.name }}"
    update: yes
    force: yes
  loop: "{{ themes }}"

- name: Clone templates
  ansible.builtin.git:
    repo: "{{ item.repo }}"
    dest: "~/.local/share/flavours/base16/templates/{{ item.name }}"
    update: yes
    force: yes
  loop: "{{ templates }}"

- name: Fix catppuccin nested structure
  ansible.builtin.shell: |
    ln -sf ~/.local/share/flavours/base16/schemes/catppuccin/base16/*.yaml ~/.local/share/flavours/base16/schemes/catppuccin/
  args:
    creates: ~/.local/share/flavours/base16/schemes/catppuccin/mocha.yaml

- name: Create flavours config
  ansible.builtin.copy:
    dest: ~/.config/flavours/config.toml
    content: |
      shell = "bash -c '{}'"
      
      [[items]]
      file = "~/.tmux.conf"
      template = "tmux"
      subtemplate = "base16"
      rewrite = true
