---
- name: Teardown workstation
  hosts: localhost
  connection: local
  become: true
  vars:
    teardown_role: "{{ role | default('server') }}"
    target_user: "{{ lookup('env', 'USER') }}"
    target_home: "{{ lookup('env', 'HOME') }}"
  tasks:
    - name: Include teardown tasks
      ansible.builtin.include_role:
        name: "{{ teardown_role }}"
        tasks_from: teardown.yml
